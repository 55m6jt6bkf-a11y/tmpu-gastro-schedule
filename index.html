    const generateWeeks = () => {
      const weeks = [];
      let startDate = new Date('2026-08-01');
      const endDate = new Date('2026-10-31');
      
      let currentMonth = -1;
      let weekIdCounter = 1;
      let currentWeek = null;

      for (let d = new Date(startDate); d <= endDate; d.setDate(d.getDate() + 1)) {
        const dayOfWeek = d.getDay();
        if (dayOfWeek === 0 || dayOfWeek === 6) continue;

        const month = d.getMonth() + 1;
        
        if (month !== currentMonth) {
          currentMonth = month;
          currentWeek = { id: `week_${currentMonth}_${weekIdCounter++}`, month: currentMonth, dates: [] };
          weeks.push(currentWeek);
        } else if (dayOfWeek === 1 && currentWeek.dates.length > 0) {
          currentWeek = { id: `week_${currentMonth}_${weekIdCounter++}`, month: currentMonth, dates: [] };
          weeks.push(currentWeek);
        }
        
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        currentWeek.dates.push(`${yyyy}-${mm}-${dd}`);
      }

      weeks.forEach(week => {
        if (week.dates.length > 0) {
          const firstDate = new Date(week.dates[0]);
          const lastDate = new Date(week.dates[week.dates.length - 1]);
          if (week.dates.length === 1) {
             const days = ['日', '月', '火', '水', '木', '金', '土'];
             week.label = `${firstDate.getMonth() + 1}/${firstDate.getDate()}(${days[firstDate.getDay()]})`;
          } else {
             week.label = `${firstDate.getMonth() + 1}/${firstDate.getDate()} 〜 ${lastDate.getMonth() + 1}/${lastDate.getDate()}`;
          }
        }
      });
      return weeks.filter(w => w.dates.length > 0);
    };

    const getRoleColor = (role, isNewBooth = false) => {

      const externals = ['若林', '女川', '涌谷', '一番町', '健診', '刈田', '真壁', '矢本', '渡辺', '佐藤', 'ゆう', '高砂', '循環器', '葵会', '米谷'];

    const PM_BOOTHS = ['若林午後CS', '若林CS', '午後CS', 'ゆうファミリー', '循環器センター'];
    const getPeriod = (role) => (PM_BOOTHS.includes(role) || role.includes('午後')) ? 'PM' : 'AM';
    const VALID_EGD2_STAFF = ['福士', '片山', '金', '伊藤', '宮下', '大沼', '早川', '及川', '永井', '佐々木'];

    const checkConflicts = (booths) => {
      const staffMap = {}; 
      booths.forEach((booth, localIndex) => {
        if (!booth.staff || booth.role === '上部EUS') return; 
        const names = booth.staff.split(/[\s,、・]+|or/).map(n => getPureName(n)).filter(n => {
          if (n.length === 0) return false;
          if (n === 'なし') return false;
          if (n.includes('年目')) return false;
          if (n === 'back' || n === 'up') return false;
          if (/^[✕☓×✗xX]+$/.test(n)) return false; 
          return true;
        });
        const period = getPeriod(booth.role);
        names.forEach(name => {
          if (!staffMap[name]) staffMap[name] = [];
          staffMap[name].push({ role: booth.role, period, localIndex });
        });
      });

      const conflicts = {}; 
      Object.keys(staffMap).forEach(name => {
        const assignments = staffMap[name];
        if (assignments.length > 1) {
          const ams = assignments.filter(a => a.period === 'AM');
          const pms = assignments.filter(a => a.period === 'PM');
          
          const registerConflicts = (group) => {
            if (group.length > 1) {
              group.forEach(a => {
                if (!conflicts[a.localIndex]) conflicts[a.localIndex] = [];
                const others = group.filter(other => other.localIndex !== a.localIndex).map(other => other.role);
                if (!conflicts[a.localIndex].find(c => c.name === name)) conflicts[a.localIndex].push({ name, others });
              });
            }
          };
          registerConflicts(ams);
          registerConflicts(pms);
        }
      });
      return conflicts;
    };

    const checkOnCallConflicts = (onCallName, boothsData) => {
      if (!onCallName) return null;
      const onCallNames = onCallName.split(/[\s,、・]+|or/).map(n => getPureName(n)).filter(n => n.length > 0);
      if (onCallNames.length === 0) return null;

      const errorMessages = [];

      onCallNames.forEach(pureOnCallName => {
        const foundBooths = [];
        boothsData.forEach(booth => {
          const names = booth.staff.split(/[\s,、・]+|or/).map(n => getPureName(n));
          if (names.includes(pureOnCallName)) {
            foundBooths.push(booth.role);
          }
        });

        if (foundBooths.length === 0) {
          errorMessages.push(`${pureOnCallName}: 当日の担当一覧(ブース)に名前がありません`);
        } else {
          const invalidBooths = foundBooths.filter(role => !ALLOWED_ONCALL_ROLES.includes(role));
          if (invalidBooths.length > 0) {
            errorMessages.push(`${pureOnCallName}: 兼任不可の枠 (${invalidBooths.join(', ')}) にアサインされています`);
          }
        }
      });

      return errorMessages.length > 0 ? errorMessages.join(' / ') : null;
    };

    const renderStaffWithHighlight = (staffStr, firstCall, secondCall) => {
      if (!staffStr) return null;
      const tokens = staffStr.split(/([\s,、・]+|or)/);
      
      const getCallNames = (callStr) => {
        if (!callStr) return [];
        return callStr.split(/[\s,、・]+|or/).map(n => getPureName(n)).filter(n => n.length > 0);
      };
      
      const fCallNames = getCallNames(firstCall);
      const sCallNames = getCallNames(secondCall);

      return tokens.map((token, i) => {
        const pureName = getPureName(token);
        if (pureName.length > 0) {
          if (fCallNames.includes(pureName)) {
            return <span key={i} className="bg-pink-100 text-pink-800 px-1 py-0.5 rounded border border-pink-300 inline-block mx-0.5 shadow-sm">{token}</span>;
          }
          if (sCallNames.includes(pureName)) {
            return <span key={i} className="bg-sky-100 text-sky-800 px-1 py-0.5 rounded border border-sky-300 inline-block mx-0.5 shadow-sm">{token}</span>;
          }
        }
        return <React.Fragment key={i}>{token}</React.Fragment>;
      });
    };

            if (reason.includes('AM') || reason.includes('午前')) {

            } else if (reason.includes('PM') || reason.includes('午後')) {
              leavePeriod = 'PM';
            }
          }
          leaves.push({ name, leavePeriod });
        });
        return leaves;

            dayData.forEach((item) => {

        const allRoles = Object.keys(allRolesObj).sort((a, b) => {

          const indexB = MASTER_ROLE_ORDER.indexOf(b);
          if (indexA !== -1 && indexB !== -1) return indexA - indexB;
          if (indexA !== -1) return -1;
          if (indexB !== -1) return 1;

                      )}
                      {isEditMode && (
                        <span className="bg-amber-100 text-amber-800 text-[10px] px-2 py-0.5 rounded-full font-bold animate-pulse border border-amber-300 flex items-center gap-1">
                          <IconEdit className="w-3 h-3" /> 編集中
                        </span>
                      )}
                    </div>
                  </div>

                  <div className="flex flex-col">
                    {}
                    {boothsData.map((item, localIndex) => {
                      const dataIndex = localIndex + 1;
                      
                      const isNewBooth = !defaultSchedules[selectedDate].some(defaultItem => defaultItem.role === item.role);
                      const defaultStaffObj = defaultSchedules[selectedDate].find(d => d.role === item.role);
                      const defaultStaff = defaultStaffObj ? defaultStaffObj.staff : null;
                      
                      const currentStaff = item.staff;
                      const changed = isNewBooth || defaultStaff !== currentStaff;
                      
                      const currentBoothNames = currentStaff.split(/[\s,、・]+|or/).map(n => getPureName(n)).filter(n => n.length > 0);
                      const currentBoothPeriod = getPeriod(item.role);

                      const conflictLeavesForThisBooth = parsedLeaves.filter(leave => {
                         if (!currentBoothNames.includes(leave.name)) return false;
                         return leave.leavePeriod === 'ALL' || leave.leavePeriod === currentBoothPeriod;
                      });

                      const hasLeaveConflict = conflictLeavesForThisBooth.length > 0;
                      const conflictNames = conflictLeavesForThisBooth.map(l => l.name);

                      const doubleBookings = doubleBookingConflicts[localIndex];
                      const hasDoubleBooking = doubleBookings && doubleBookings.length > 0;
                      
                      let egd2Error = null;
                      if (item.role === 'EGD②' && [2, 3, 4].includes(currentDayOfWeek) && currentStaff) {
                        const names = currentStaff.split(/[\s,、・]+|or/).map(n => getPureName(n)).filter(n => n.length > 0 && n !== 'なし' && !/^[✕☓×✗xX]+$/.test(n));
                        const invalidNames = names.filter(n => !VALID_EGD2_STAFF.includes(n));
                        if (invalidNames.length > 0) {
                          egd2Error = `検診枠です。検診登録医の入力をして下さい。(${invalidNames.join(', ')})`;
                        }
                      }

                      const isError = hasLeaveConflict || hasDoubleBooking || egd2Error;
                      
                      const rowClass = `relative flex flex-col sm:flex-row items-stretch transition-colors border-b border-slate-200 last:border-b-0 ${
                        isError ? 'bg-red-50' : isNewBooth ? 'bg-fuchsia-50/60' : changed && !isEditMode ? 'bg-amber-50/40' : 'hover:bg-slate-50'
                      }`;

                      return (
                        <div key={dataIndex} className={rowClass}>
                          {isNewBooth && <div className="absolute left-0 top-0 bottom-0 w-1.5 bg-fuchsia-400 z-10"></div>}

                          <div className={`sm:w-1/3 p-2 sm:p-3 sm:border-r border-slate-200 flex flex-col justify-center shrink-0 ${
                            isError ? 'bg-red-100/50' : isNewBooth ? 'bg-fuchsia-100/40 pl-3.5' : 'bg-slate-50/50'
                          }`}>
                            {isEditMode ? (
                              <div className="flex items-center gap-2">
                                <input 
                                  type="text" 
                                  value={item.role}
                                  onChange={(e) => handleRoleChange(dataIndex, e.target.value)}
                                  className={`w-full border rounded px-2 py-1.5 text-xs font-bold outline-none transition-colors ${
                                    isNewBooth ? 'bg-fuchsia-50 border-fuchsia-300 text-fuchsia-900 focus:border-fuchsia-500' : 'bg-white border-slate-300 text-slate-700 focus:border-blue-500'
                                  }`}
                                  placeholder="枠名を入力"
                                />
                                <button onClick={() => handleRemoveBooth(dataIndex)} className="text-slate-400 hover:text-red-500 p-1" title="枠を削除">
                                  <IconTrash2 className="w-4 h-4" />
                                </button>
                              </div>
                            ) : (
                              <span className={`inline-block px-2 py-1 rounded text-xs font-bold border w-full sm:w-auto text-center sm:text-left ${getRoleColor(item.role, isNewBooth)}`}>
                                {item.role}
                              </span>
                            )}
                          </div>
                          
                          <div className="sm:w-2/3 p-2 sm:p-3 flex flex-col justify-center min-h-[3rem]">
                            {isEditMode ? (
                              <div className="w-full">
                                {changed && !isNewBooth && (
                                  <div className="text-[10px] text-slate-400 mb-0.5 flex items-center gap-1">
                                    基本: {defaultStaff} <span className="text-amber-500 font-bold">(変更あり)</span>
                                  </div>
                                )}
                                {isNewBooth && (
                                  <div className="text-[10px] text-fuchsia-600 mb-0.5 flex items-center gap-1 font-bold">
                                    <IconSparkles className="w-3 h-3" /> 追加枠
                                  </div>
                                )}
                                <input
                                  type="text"
                                  value={currentStaff}
                                  onChange={(e) => handleInputChange(dataIndex, e.target.value)}
                                  className={`w-full p-2 border-2 rounded-md outline-none transition-all font-medium text-sm ${
                                    isError ? 'border-red-400 bg-red-50 text-red-900 focus:border-red-500' 
                                    : isNewBooth ? 'border-fuchsia-300 bg-white focus:border-fuchsia-500'
                                    : changed ? 'border-amber-300 bg-amber-50 focus:border-amber-500' 
                                    : 'border-slate-300 bg-white focus:border-blue-500'
                                  }`}
                                  placeholder="担当者を入力"
                                />
                                
                                {hasLeaveConflict && (
                                  <div className="text-red-600 text-[10px] font-bold mt-1 flex items-center gap-1">
                                    <IconAlertTriangle className="w-3 h-3" /> 休暇者 ({conflictNames.join(', ')}) が含まれています
                                  </div>
                                )}
                                {hasDoubleBooking && doubleBookings.map((db, i) => (
                                  <div key={i} className="text-red-600 text-[10px] font-bold mt-1 flex items-center gap-1">
                                    <IconAlertTriangle className="w-3 h-3" /> 重複: {db.name} (他: {db.others.join(', ')})
                                  </div>
                                ))}
                                {egd2Error && (
                                  <div className="text-rose-600 text-[10px] font-bold mt-1 flex items-center gap-1 bg-rose-100/50 p-1 rounded">
                                    <IconAlertOctagon className="w-3.5 h-3.5" /> {egd2Error}
                                  </div>
                                )}
                              </div>
                            ) : (
                              <div className="flex items-center justify-between w-full">
                                <div className="flex flex-col">
                                  {changed ? (
                                    <>
                                      {!isNewBooth && (
                                        <div className="flex items-center gap-1 text-slate-400 text-[10px] font-medium mb-0.5">
                                          <span className="line-through decoration-slate-400">{defaultStaff}</span>
                                          <IconArrowRight className="w-2.5 h-2.5" />
                                        </div>
                                      )}
                                      <span className={`text-base sm:text-lg font-black drop-shadow-sm ${
                                        isError ? 'text-red-700' : isNewBooth ? 'text-fuchsia-700' : 'text-red-600'
                                      }`}>
                                        {currentStaff ? renderStaffWithHighlight(currentStaff, activeOnCall.first, activeOnCall.second) : <span className="text-slate-300 text-sm font-normal">（未設定）</span>}
                                      </span>
                                    </>
                                  ) : (
                                    <span className={`text-base sm:text-lg font-black drop-shadow-sm ${isError ? 'text-red-700' : 'text-slate-800'}`}>
                                      {currentStaff ? renderStaffWithHighlight(currentStaff, activeOnCall.first, activeOnCall.second) : null}
                                    </span>
                                  )}
                                  
                                  {hasLeaveConflict && (
                                    <div className="text-red-600 text-[10px] font-bold mt-0.5 flex items-center gap-1">
                                      <IconAlertTriangle className="w-3 h-3" /> 休暇者 ({conflictNames.join(', ')}) が含まれています
                                    </div>
                                  )}
                                  {hasDoubleBooking && doubleBookings.map((db, i) => (
                                    <div key={i} className="text-red-600 text-[10px] font-bold mt-0.5 flex items-center gap-1">
                                      <IconAlertTriangle className="w-3 h-3" /> 重複: {db.name} (他: {db.others.join(', ')})
                                    </div>
                                  ))}
                                  {egd2Error && (
                                    <div className="text-rose-600 text-[10px] font-bold mt-0.5 flex items-center gap-1 bg-rose-100/50 p-1 rounded w-fit">
                                      <IconAlertOctagon className="w-3.5 h-3.5" /> {egd2Error}
                                    </div>
                                  )}
                                </div>
                                
                                <div className="flex gap-1 shrink-0 ml-2 flex-col sm:flex-row items-end">
                                  {isNewBooth && !isError && (
                                    <span className="inline-flex items-center gap-1 bg-fuchsia-100 text-fuchsia-700 text-[10px] px-1.5 py-0.5 rounded font-bold border border-fuchsia-300">
                                      <IconSparkles className="w-3 h-3" />
                                      <span className="hidden sm:inline">追加枠</span>
                                    </span>
                                  )}
                                  {isError && (
                                    <span className="inline-flex items-center gap-1 bg-red-600 text-white text-[10px] px-1.5 py-0.5 rounded font-bold shadow-sm">
                                      <IconAlertTriangle className="w-3 h-3" />
                                      <span className="hidden sm:inline">アラート</span>
                                    </span>
                                  )}
                                  {changed && !isError && !isNewBooth && (
                                    <span className="inline-flex items-center gap-1 bg-amber-100 text-amber-700 text-[10px] px-1.5 py-0.5 rounded font-bold border border-amber-300">
                                      <IconAlertCircle className="w-3 h-3" />
                                      <span className="hidden sm:inline">変更あり</span>
                                    </span>
                                  )}
                                </div>
                              </div>
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                  
                  {isEditMode && (
                    <div className="bg-slate-50 p-3 border-t border-slate-200">
                      <button onClick={handleAddBooth} className="w-full py-2.5 bg-white border-2 border-dashed border-fuchsia-300 text-fuchsia-600 rounded-lg flex items-center justify-center gap-2 hover:bg-fuchsia-50 transition-colors font-bold text-sm">
                        <IconPlus className="w-4 h-4" /> 日ごとの追加枠（臨時枠）を作成する
                      </button>
                    </div>
                  )}
                </div>
              </>
            )}

            {isEditMode && (
              <div className="fixed bottom-0 left-0 right-0 bg-white border-t-2 border-blue-500 p-3 shadow-[0_-10px_20px_-5px_rgba(0,0,0,0.15)] z-40">
                <div className="max-w-4xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
                  <div className="text-sm font-bold text-blue-800 flex items-center gap-2 w-full sm:w-auto justify-center sm:justify-start">
                    <IconEdit className="w-5 h-5" />
                    <span>複数日の変更を保持中</span>
                    {changedDaysCount > 0 && (
                      <span className="bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full text-xs animate-pulse">
                        {changedDaysCount}日分
                      </span>
                    )}
                  </div>
                  <div className="flex gap-2 w-full sm:w-auto">
                    <button
                      onClick={handleCancel}
                      disabled={isSaving}
                      className="flex-1 sm:flex-none px-4 py-2.5 sm:py-2 rounded-md text-sm font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 transition-colors disabled:opacity-50 border border-slate-300 text-center"
                    >
                      キャンセル
                    </button>
                    <button
                      onClick={handleSave}
                      disabled={isSaving}
                      className="flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-6 py-2.5 sm:py-2 rounded-md text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 shadow-sm transition-colors disabled:opacity-50"
                    >
                      {isSaving ? <IconLoader2 className="w-4 h-4" /> : <IconSave className="w-4 h-4" />}
                      {isSaving ? '保存中...' : (changedDaysCount > 0 ? `${changedDaysCount}日分を一括保存` : '保存')}
                    </button>
                  </div>
                </div>
              </div>
            )}
          </main>

          {showLoginModal && (
            <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
              <div className="bg-white rounded-xl shadow-xl w-full max-w-sm overflow-hidden animate-in fade-in zoom-in-95 duration-200">
                <div className="flex justify-between items-center p-4 border-b border-slate-200 bg-slate-50">
                  <h3 className="font-bold text-sm flex items-center gap-1.5 text-slate-800">
                    <IconLock className="w-4 h-4 text-blue-600" />
                    管理者ログイン
                  </h3>
                  <button 
                    onClick={() => { setShowLoginModal(false); setLoginError(''); setPassword(''); }}
                    className="p-1 hover:bg-slate-200 rounded text-slate-500 transition-colors"
                  >
                    <IconX className="w-4 h-4" />
                  </button>
                </div>
                
                <form onSubmit={handleLogin} className="p-5">
                  <p className="text-xs text-slate-600 mb-4 leading-relaxed">
                    出番や枠を変更するにはパスワードを入力してください。
                  </p>
                  
                  <div className="mb-5">
                    <input
                      type="password"
                      placeholder="パスワード"
                      value={password}
                      onChange={(e) => setPassword(e.target.value)}
                      className="w-full p-2.5 border-2 border-slate-300 rounded-md outline-none focus:border-blue-500 transition-all text-sm font-medium"
                      autoFocus
                    />
                    {loginError && (
                      <p className="text-red-600 text-xs mt-1.5 flex items-center gap-1 font-bold">
                        <IconAlertCircle className="w-3.5 h-3.5" />
                        {loginError}
                      </p>
                    )}
                  </div>
                  
                  <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-md shadow-sm transition-colors text-sm">
                    ログイン
                  </button>
                </form>
              </div>
            </div>
          )}

          {showHistoryModal && (
            <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
              <div className="bg-white rounded-xl shadow-xl w-full max-w-2xl max-h-[80vh] flex flex-col overflow-hidden animate-in fade-in zoom-in-95 duration-200">
                <div className="flex justify-between items-center p-4 border-b border-slate-200 bg-slate-50">
                  <h3 className="font-bold text-base flex items-center gap-1.5 text-slate-800">
                    <IconClock className="w-5 h-5 text-blue-600" />
                    更新履歴（日付ごとの最新更新）
                  </h3>
                  <button 
                    onClick={() => setShowHistoryModal(false)}
                    className="p-1 hover:bg-slate-200 rounded text-slate-500 transition-colors"
                  >
                    <IconX className="w-5 h-5" />
                  </button>
                </div>
                
                <div className="p-4 overflow-y-auto bg-slate-50 flex-1">
                  {(() => {
                    const historyList = Object.entries(schedulesMetadata)
                      .filter(([_, meta]) => meta && meta.updatedAt)
                      .map(([date, meta]) => ({
                        date,
                        updatedAt: new Date(meta.updatedAt),
                        updatedBy: meta.updatedBy
                      }))
                      .sort((a, b) => b.updatedAt - a.updatedAt);
                      
                    if (historyList.length === 0) {
                      return <p className="text-center text-slate-500 py-8 text-sm">更新履歴がありません</p>;
                    }
                    
                    return (
                      <div className="bg-white rounded-lg border border-slate-200 shadow-sm overflow-hidden">
                        <table className="w-full text-sm text-left">
                          <thead className="bg-slate-100 border-b border-slate-200 text-slate-600">
                            <tr>
                              <th className="p-3 font-bold">更新日時</th>
                              <th className="p-3 font-bold">対象日</th>
                              <th className="p-3 font-bold hidden sm:table-cell">更新者ID</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-100">
                            {historyList.map(item => (
                              <tr key={item.date} className="hover:bg-slate-50 transition-colors">
                                <td className="p-3 whitespace-nowrap text-slate-700 font-medium">
                                  {item.updatedAt.toLocaleString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })}
                                </td>
                                <td className="p-3 font-bold text-slate-800">
                                  {item.date.replace(/-/g, '/')} {getDayName(item.date)}
                                </td>
                                <td className="p-3 text-[10px] text-slate-400 font-mono hidden sm:table-cell">
                                  {item.updatedBy || '不明'}
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    );
                  })()}
                </div>
                <div className="p-4 border-t border-slate-200 bg-white flex justify-end">
                  <button 
                    onClick={() => setShowHistoryModal(false)}
                    className="px-5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-md font-bold text-sm transition-colors border border-slate-300"
                  >
                    閉じる
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
