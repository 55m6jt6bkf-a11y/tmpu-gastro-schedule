    const getRoleColor = (role) => {
      if (role === '休暇者') return 'bg-rose-100 text-rose-800 border-rose-300';
      const externals = ['若林', '女川', '涌谷', '一番町', '健診', '刈田', '真壁', '矢本', '渡辺', '佐藤', 'ゆう', '高砂', '循環器', '葵会', '米谷'];
      if (externals.some(kw => role.includes(kw))) return 'bg-stone-100 text-stone-700 border-stone-300'; 
      if (role.includes('新患')) return 'bg-emerald-50 text-emerald-800 border-emerald-200';
      if (role.includes('EGD')) return 'bg-blue-50 text-blue-800 border-blue-200';
      if (role.includes('EUS')) return 'bg-purple-50 text-purple-800 border-purple-200';
      if (role.includes('CS')) return 'bg-orange-50 text-orange-800 border-orange-200';
      if (role.includes('AUS')) return 'bg-pink-50 text-pink-800 border-pink-200';
      if (role.includes('back up')) return 'bg-slate-700 text-white border-slate-800';
      return 'bg-white text-slate-700 border-slate-300';

    const PM_BOOTHS = ['若林午後CS', '午後CS', 'ゆうファミリー', '循環器センター'];
    const getPeriod = (role) => PM_BOOTHS.includes(role) ? 'PM' : 'AM';

    const checkConflicts = (booths) => {
      const staffMap = {}; 
      booths.forEach((booth, localIndex) => {
        if (!booth.staff) return;
        const names = booth.staff.split(/[\s,、・]+|or/).map(n => n.trim())
          .filter(n => n.length > 0 && n !== 'なし' && !n.includes('年目') && n !== 'back' && n !== 'up');
        const period = getPeriod(booth.role);
        names.forEach(name => {
          if (!staffMap[name]) staffMap[name] = [];
          staffMap[name].push({ role: booth.role, period, localIndex });
        });
      });

      const conflicts = {}; 
      Object.keys(staffMap).forEach(name => {
        const assignments = staffMap[name];
        if (assignments.length > 1) {
          const ams = assignments.filter(a => a.period === 'AM');
          const pms = assignments.filter(a => a.period === 'PM');
          const registerConflicts = (group) => {
            if (group.length > 1) {
              group.forEach(a => {
                if (!conflicts[a.localIndex]) conflicts[a.localIndex] = [];
                const others = group.filter(other => other.localIndex !== a.localIndex).map(other => other.role);
                if (!conflicts[a.localIndex].find(c => c.name === name)) {
                    conflicts[a.localIndex].push({ name, others });
                }
              });
            }
          };
          registerConflicts(ams);
          registerConflicts(pms);
        }
      });
      return conflicts;
    };

      return `${d.getMonth()+1}/${d.getDate()} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;

      const addCustomBooth = () => {
        setEditData([...editData, { role: '臨時枠', staff: '', isCustom: true }]);
      };

      const removeCustomBooth = (index) => {
        const newData = [...editData];
        newData.splice(index, 1);
        setEditData(newData);
      };

      const handleSave = async () => {
        if (!user) return;
        setIsSaving(true);
        try {
          const { getFirestore, doc, setDoc } = window.FirebaseLib;
          const db = getFirestore();
          await setDoc(doc(db, 'artifacts', 'gastro-schedule', 'public', 'data', 'schedules_v6', selectedDate), {
            staffData: JSON.stringify(editData),
            updatedAt: new Date().toISOString(),
            updatedBy: user.uid
          });
          setIsEditing(false);
        } catch (error) {
          alert("保存に失敗しました。");
        } finally {
          setIsSaving(false);
        }
      };

      const handleLogin = (e) => {
        e.preventDefault();
        if (password === 'admin123') {
          setIsAdmin(true);
          setShowLoginModal(false);
          setPassword('');
          setLoginError('');
        } else {
          setLoginError('パスワードが間違っています');
        }
      };

      const downloadCSV = () => {
        const weekData = weeksData.find(w => w.id === selectedWeek);
        let csvContent = "\uFEFF日付,曜日,役割,担当者\n"; // BOM付与(文字化け防止)
        
        weekData.dates.forEach(dateStr => {
          const d = new Date(dateStr);
          const dayStr = dayNames[d.getDay()].replace(/[()]/g, '');
          const dataToExport = schedules[dateStr];
          dataToExport.forEach(item => {
            const role = item.role.replace(/"/g, '""');
            const staff = item.staff.replace(/"/g, '""');
            csvContent += `${dateStr},${dayStr},"${role}","${staff}"\n`;
          });
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `業務表_${weekData.label}_${weekData.dates[0]}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      if (isLoading) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-slate-50">
            <div className="flex flex-col items-center gap-4 text-slate-500">
              <Icon.Loader2 className="w-8 h-8 animate-spin text-blue-600" />
              <p className="text-sm font-medium">データを読み込んでいます...</p>
            </div>
          </div>
        );
      }

      const currentMonthWeeks = weeksData.filter(w => w.month === selectedMonth);
      const currentWeekData = weeksData.find(w => w.id === selectedWeek);
      const activeData = isEditing ? editData : schedules[selectedDate];
      
      const leavesData = activeData[0] || { staff: '' };
      const boothsData = activeData.slice(1);
      const defaultBoothsData = defaultSchedules[selectedDate].slice(1);

      const leaveNames = leavesData.staff.split(/[\s,、・]+|or/).map(n => n.trim()).filter(n => n.length > 0);
      const doubleBookingConflicts = checkConflicts(boothsData);
      const lastUpdatedStr = formatDateTime(updatedAts[selectedDate]);

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 font-sans pb-28">
          {/* Header */}
          <header className="bg-blue-800 text-white p-3 sm:p-4 shadow-md sticky top-0 z-30">
            <div className="max-w-4xl mx-auto flex justify-between items-start sm:items-center flex-col sm:flex-row gap-3">
              <div className="flex flex-col sm:flex-row sm:items-baseline gap-1 sm:gap-3">
                <div className="flex items-center gap-2">
                  <Icon.Calendar className="w-5 h-5 text-blue-200" />
                  <h1 className="text-lg font-bold tracking-tight">業務変更表</h1>
                </div>
                {lastUpdatedStr && (
                  <span className="text-xs text-blue-200/90 font-medium flex items-center gap-1">
                    <Icon.Clock className="w-3 h-3" /> 最終更新: {lastUpdatedStr}
                  </span>
                )}
              </div>
              <div className="flex items-center gap-2 self-end sm:self-auto">
                {isAdmin ? (
                  <button onClick={() => {setIsAdmin(false); setIsEditing(false);}} className="flex items-center gap-1.5 text-xs bg-blue-900 hover:bg-blue-700 px-3 py-1.5 rounded-md border border-blue-700">
                    <Icon.LogOut className="w-3.5 h-3.5" /> <span className="hidden sm:inline">ログアウト</span>
                  </button>
                ) : (
                  <button onClick={() => setShowLoginModal(true)} className="flex items-center gap-1.5 text-xs bg-blue-600 hover:bg-blue-500 px-3 py-1.5 rounded-md border border-blue-500 shadow-sm">
                    <Icon.Lock className="w-3.5 h-3.5" /> <span className="hidden sm:inline">管理者</span>
                  </button>
                )}
              </div>
            </div>
          </header>

          <main className="max-w-4xl mx-auto p-3 sm:p-4">
            
            {/* Nav */}
            <div className="bg-white rounded-lg shadow-sm border border-slate-200 p-2 mb-4 sticky top-[72px] z-20">
              <div className="flex justify-between items-center mb-2 pb-2 border-b border-slate-100">
                <select value={selectedMonth} onChange={handleMonthChange} className="p-1.5 rounded-md border-2 border-blue-200 text-sm font-bold bg-blue-50 text-blue-800 outline-none focus:border-blue-500">
                  <option value="2026-08">2026年 8月</option>
                  <option value="2026-09">2026年 9月</option>
                  <option value="2026-10">2026年 10月</option>
                </select>
                <button onClick={downloadCSV} className="flex items-center gap-1.5 bg-emerald-600 text-white px-3 py-1.5 rounded-md text-xs font-bold hover:bg-emerald-700 shadow-sm">
                  <Icon.Download className="w-3.5 h-3.5" /> <span className="hidden sm:inline">Excel(CSV)出力</span><span className="sm:hidden">出力</span>
                </button>
              </div>
              <div className="flex overflow-x-auto gap-1 pb-1.5 mb-1.5 border-b border-slate-100 hide-scrollbar">
                {currentMonthWeeks.map(week => (
                  <button key={week.id} onClick={() => handleWeekChange(week.id)} className={`whitespace-nowrap px-3 py-1.5 rounded-md text-xs font-bold ${selectedWeek === week.id ? 'bg-blue-100 text-blue-800' : 'text-slate-500 hover:bg-slate-100'}`}>
                    {week.label}
                  </button>
                ))}
              </div>
              <div className="flex overflow-x-auto gap-1.5 hide-scrollbar">
                {currentWeekData.dates.map(dateStr => {
                  const d = new Date(dateStr);
                  const isSelected = selectedDate === dateStr;
                  return (
                    <button key={dateStr} onClick={() => handleDateChange(dateStr)} className={`flex-1 min-w-[55px] flex flex-col items-center justify-center py-1.5 px-1 rounded-lg border ${isSelected ? 'bg-blue-600 text-white border-blue-600 shadow-sm' : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'}`}>
                      <span className={`text-[10px] ${isSelected ? 'opacity-90' : 'text-slate-400'}`}>{d.getMonth()+1}/{d.getDate()}</span>
                      <span className="text-sm font-bold">{dayNames[d.getDay()]}</span>
                    </button>
                  );
                })}
              </div>
            </div>

            {/* Admin Panel */}
            {(isAdmin && !isEditing) && (
              <div className="bg-blue-50/50 rounded-lg border border-blue-200 p-3 mb-4 flex justify-between items-center">
                <div className="flex items-center gap-1.5 text-blue-800">
                  <Icon.ShieldAlert className="w-4 h-4" /> <span className="font-bold text-xs">管理者モード</span>
                </div>
                <button onClick={handleEditStart} className="flex items-center gap-1.5 bg-white border border-blue-600 text-blue-700 hover:bg-blue-600 hover:text-white px-4 py-2 rounded-md text-sm font-bold shadow-sm">
                  <Icon.Edit className="w-3.5 h-3.5" /> 出番を変更・追加する
                </button>
              </div>
            )}

            {/* Leaves */}
            <div className="bg-white rounded-lg shadow-sm border-2 border-rose-200 mb-4 overflow-hidden">
              <div className="bg-rose-50 border-b border-rose-200 px-4 py-2.5 flex items-center gap-2">
                <span className="bg-rose-100 text-rose-800 text-xs px-2 py-1 rounded border border-rose-300 font-bold">休暇者</span>
                <span className="text-xs text-rose-600 font-medium">※カンマやスペース区切りで入力</span>
              </div>
              <div className="p-3">
                {isEditing ? (
                  <input type="text" placeholder="例: 片山, 遠藤" value={leavesData.staff} onChange={(e) => handleInputChange(0, e.target.value)} className="w-full p-2 border-2 border-rose-300 rounded-md outline-none focus:border-rose-500 font-medium text-sm bg-rose-50/30" />
                ) : (
                  <div className="text-sm font-bold text-slate-800 min-h-[1.5rem] flex items-center">
                    {leavesData.staff || <span className="text-slate-400 font-normal">（なし）</span>}
                  </div>
                )}
              </div>
            </div>

            {/* Booths */}
            <div className="bg-white rounded-lg shadow-sm border border-slate-300 overflow-hidden mb-8">
              <div className="bg-slate-100 border-b-2 border-slate-300 px-4 py-3 flex justify-between items-center">
                <h2 className="text-base font-black text-slate-700">
                  {new Date(selectedDate).getMonth()+1}/{new Date(selectedDate).getDate()} {dayNames[new Date(selectedDate).getDay()]}
                </h2>
                {isEditing && (
                  <span className="bg-amber-100 text-amber-800 text-[10px] px-2 py-0.5 rounded-full font-bold flex items-center gap-1 animate-pulse border border-amber-300">
                    <Icon.Edit className="w-3 h-3" /> 編集中
                  </span>
                )}
              </div>

              <div className="divide-y-2 divide-slate-200">
                {boothsData.map((item, localIndex) => {
                  const dataIndex = localIndex + 1;
                  const isCustom = item.isCustom;
                  const defaultStaff = isCustom ? '' : (defaultBoothsData[localIndex]?.staff || '');
                  const currentStaff = item.staff;
                  const changed = isCustom ? (currentStaff !== '') : (defaultStaff !== currentStaff);
                  
                  const conflictNames = leaveNames.filter(name => currentStaff.includes(name));
                  const hasLeaveConflict = conflictNames.length > 0;
                  const doubleBookings = doubleBookingConflicts[localIndex];
                  const hasDoubleBooking = doubleBookings && doubleBookings.length > 0;
                  const isError = hasLeaveConflict || hasDoubleBooking;
                  
                  return (
                    <div key={dataIndex} className={`flex flex-col sm:flex-row items-stretch ${isError ? 'bg-red-50' : (changed && !isEditing) ? 'bg-amber-50/40' : 'hover:bg-slate-50'}`}>
                      {/* Left: Role */}
                      <div className={`sm:w-1/3 p-2 sm:p-3 sm:border-r-2 border-slate-200 flex items-center justify-between sm:justify-start shrink-0 ${isError ? 'bg-red-100/50' : 'bg-slate-50/50'}`}>
                        {(isCustom && isEditing) ? (
                          <div className="flex w-full items-center">
                            <input type="text" value={item.role} placeholder="枠名" onChange={(e) => handleCustomRoleChange(dataIndex, e.target.value)} className="w-full p-1.5 border-2 border-blue-300 rounded text-xs font-bold outline-none focus:border-blue-500 bg-white" />
                            <button onClick={() => removeCustomBooth(dataIndex)} className="ml-2 text-red-500 hover:bg-red-100 p-1 rounded" title="枠を削除"><Icon.X className="w-4 h-4" /></button>
                          </div>
                        ) : (
                          <span className={`inline-block px-2 py-1 rounded text-xs font-bold border w-full sm:w-auto text-center sm:text-left ${getRoleColor(item.role)}`}>{item.role}</span>
                        )}
                      </div>
                      
                      {/* Right: Staff */}
                      <div className="sm:w-2/3 p-2 sm:p-3 flex flex-col justify-center min-h-[3.5rem]">
                        {isEditing ? (
                          <div className="w-full">
                            {(changed && !isCustom) && (
                              <div className="text-[10px] text-slate-400 mb-0.5 flex items-center gap-1">基本: {defaultStaff} <span className="text-amber-500 font-bold">(変更あり)</span></div>
                            )}
                            {isCustom && <div className="text-[10px] text-blue-500 mb-0.5 font-bold flex items-center gap-1"><Icon.Plus className="w-3 h-3"/> 臨時追加枠</div>}
                            
                            <input type="text" placeholder="担当者名" value={currentStaff} onChange={(e) => handleInputChange(dataIndex, e.target.value)} className={`w-full p-2 border-2 rounded-md outline-none focus:border-blue-500 font-medium text-sm ${isError ? 'border-red-400 bg-red-50 text-red-900' : changed ? 'border-amber-300 bg-amber-50' : 'border-slate-300 bg-white'}`} />
                            
                            {hasLeaveConflict && <div className="text-red-600 text-[10px] font-bold mt-1 flex items-center gap-1"><Icon.AlertTriangle className="w-3 h-3"/> 休暇者 ({conflictNames.join(', ')}) が含まれています</div>}
                            {hasDoubleBooking && doubleBookings.map((db, i) => <div key={i} className="text-red-600 text-[10px] font-bold mt-1 flex items-center gap-1"><Icon.AlertTriangle className="w-3 h-3"/> 重複: {db.name} (他: {db.others.join(', ')})</div>)}
                          </div>
                        ) : (
                          <div className="flex items-center justify-between w-full">
                            <div className="flex flex-col">
                              {(changed || isCustom) ? (
                                <>
                                  {!isCustom ? (
                                    <div className="flex items-center gap-1 text-slate-400 text-[10px] font-medium mb-0.5"><span className="line-through">{defaultStaff}</span><Icon.ArrowRight className="w-2.5 h-2.5" /></div>
                                  ) : <div className="text-[10px] text-blue-500 font-bold mb-0.5">臨時追加枠</div>}
                                  <span className={`text-base sm:text-lg font-black drop-shadow-sm ${isError ? 'text-red-700' : 'text-red-600'}`}>{currentStaff || <span className="text-slate-300">未入力</span>}</span>
                                </>
                              ) : (
                                <span className={`text-sm font-bold ${isError ? 'text-red-700' : 'text-slate-800'}`}>{currentStaff}</span>
                              )}
                              
                              {hasLeaveConflict && <div className="text-red-600 text-[10px] font-bold mt-0.5 flex items-center gap-1"><Icon.AlertTriangle className="w-3 h-3"/> 休暇者 ({conflictNames.join(', ')}) が含まれています</div>}
                              {hasDoubleBooking && doubleBookings.map((db, i) => <div key={i} className="text-red-600 text-[10px] font-bold mt-0.5 flex items-center gap-1"><Icon.AlertTriangle className="w-3 h-3"/> 重複: {db.name} (他: {db.others.join(', ')})</div>)}
                            </div>
                            
                            <div className="flex gap-1 shrink-0 ml-2">
                              {isError && <span className="inline-flex items-center gap-1 bg-red-600 text-white text-[10px] px-1.5 py-0.5 rounded font-bold shadow-sm"><Icon.AlertTriangle className="w-3 h-3"/><span className="hidden sm:inline">アラート</span></span>}
                              {(changed && !isError) && <span className="inline-flex items-center gap-1 bg-amber-100 text-amber-700 text-[10px] px-1.5 py-0.5 rounded font-bold border border-amber-300"><Icon.AlertCircle className="w-3 h-3"/><span className="hidden sm:inline">変更あり</span></span>}
                            </div>
                          </div>
                        )}
                      </div>
                    </div>
                  );
                })}
                
                {isEditing && (
                  <div className="p-4 bg-slate-50 flex justify-center">
                    <button onClick={addCustomBooth} className="flex items-center gap-1.5 bg-white border-2 border-dashed border-blue-300 text-blue-600 hover:bg-blue-50 px-6 py-2.5 rounded-lg text-sm font-bold w-full sm:w-auto shadow-sm">
                      <Icon.Plus className="w-4 h-4" /> 臨時枠（ブース）を追加
                    </button>
                  </div>
                )}
              </div>
            </div>
          </main>

          {isEditing && (
            <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-300 p-3 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.1)] z-40">
              <div className="max-w-4xl mx-auto flex justify-end gap-2">
                <button onClick={() => setIsEditing(false)} disabled={isSaving} className="px-4 py-2 rounded-md text-sm font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 border border-slate-300">キャンセル</button>
                <button onClick={handleSave} disabled={isSaving} className="flex items-center gap-1.5 px-6 py-2 rounded-md text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 shadow-sm disabled:opacity-50">
                  {isSaving ? <Icon.Loader2 className="w-4 h-4 animate-spin" /> : <Icon.Save className="w-4 h-4" />}
                  {isSaving ? '保存中...' : '変更を保存'}
                </button>
              </div>
            </div>
          )}

          {showLoginModal && (
            <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
              <div className="bg-white rounded-xl shadow-xl w-full max-w-sm overflow-hidden animate-in fade-in zoom-in-95 duration-200">
                <div className="flex justify-between items-center p-4 border-b border-slate-200 bg-slate-50">
                  <h3 className="font-bold text-sm flex items-center gap-1.5 text-slate-800"><Icon.Lock className="w-4 h-4 text-blue-600" /> 管理者ログイン</h3>
                  <button onClick={() => {setShowLoginModal(false); setLoginError(''); setPassword('');}} className="p-1 hover:bg-slate-200 rounded text-slate-500"><Icon.X className="w-4 h-4" /></button>
                </div>
                <form onSubmit={handleLogin} className="p-5">
                  <p className="text-xs text-slate-600 mb-4 leading-relaxed">出番を変更するにはパスワードを入力してください。<br/><span className="inline-block mt-1.5 px-1.5 py-0.5 bg-blue-50 text-blue-700 rounded font-bold border border-blue-200">パスワード: admin123</span></p>
                  <div className="mb-5">
                    <input type="password" placeholder="パスワード" value={password} onChange={(e) => setPassword(e.target.value)} className="w-full p-2.5 border-2 border-slate-300 rounded-md outline-none focus:border-blue-500 text-sm font-medium" autoFocus />
                    {loginError && <p className="text-red-600 text-xs mt-1.5 flex items-center gap-1 font-bold"><Icon.AlertCircle className="w-3.5 h-3.5" /> {loginError}</p>}
                  </div>
                  <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-md shadow-sm text-sm">ログイン</button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // 読み込み完了後に描画を実行
    if (window.FirebaseLib) {
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    } else {
      window.addEventListener('firebase-loaded', () => {
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
      });
    }
  </script>
</body>
</html>
