        { role: 'ゆうファミリー', staff: '瓜田宗or瓜田愛or竹本or田島or木内' },

        { role: '新患①', staff: '伊藤' }, { role: '新患②', staff: '瓜田宗' }, { role: '新患③', staff: '竹本' },
        { role: 'EGD①', staff: '及川・田島' }, { role: 'EGD②', staff: '福士' }, { role: 'EGD③', staff: '金・齋藤・巽' },
        { role: 'EUS', staff: 'なし' },

        { role: '透視CS', staff: '吉野' }, { role: '午後CS', staff: '大沼・及川' },
        { role: '専攻医AUS', staff: '2年目' }, { role: 'back up', staff: '大沼・瓜田愛' },
        { role: '若林EGD', staff: '石川・内海・小岩井' }, { role: '健診プラザ', staff: '小暮' }, { role: '女川EGD&CS', staff: '片山' },
        { role: '高砂内科', staff: '遠藤' }, { role: '若林午後CS', staff: '近藤・永井' }, { role: '循環器センター', staff: '早川' },
      ],
      // 金曜 (4)
      [
        { role: '休暇者', staff: '' },
        { role: '新患①', staff: '大沼' }, { role: '新患②', staff: '及川' }, { role: '新患③', staff: '木内' },
        { role: 'EGD①', staff: '早川・八子・山田' }, { role: 'EGD②', staff: '永井' }, { role: 'EGD③', staff: '金・竹本' },
        { role: 'EUS', staff: '廣田・宮下・瓜田宗・齋藤・巽' },
        { role: 'CS①', staff: '猪股・田島' }, { role: 'CS②', staff: 'なし' },
        { role: '午後CS', staff: '早川・永井' },
        { role: '専攻医AUS', staff: '2年目' }, { role: 'back up', staff: '小暮' },
        { role: '葵会EGD', staff: '福士' }, { role: '若林EGD', staff: '高須・目黒・小岩井' },
        { role: '刈田病院', staff: '伊藤' }, { role: '渡辺病院', staff: '遠藤' }, { role: '一番町', staff: '片山' },
        { role: '米谷病院', staff: '巽or齋藤or八子or山田' }, { role: '若林午後CS', staff: '石川・さやか' }, { role: '循環器センター', staff: '猪股' },
      ]
    ];

    // 2026年 8月〜10月の平日（祝日除外）
    const weeksData = [
      { id: '2026-08-W1', month: '2026-08', label: '第1週', dates: ['2026-08-03','2026-08-04','2026-08-05','2026-08-06','2026-08-07'] },
      { id: '2026-08-W2', month: '2026-08', label: '第2週', dates: ['2026-08-10','2026-08-12','2026-08-13','2026-08-14'] }, // 8/11山の日
      { id: '2026-08-W3', month: '2026-08', label: '第3週', dates: ['2026-08-17','2026-08-18','2026-08-19','2026-08-20','2026-08-21'] },
      { id: '2026-08-W4', month: '2026-08', label: '第4週', dates: ['2026-08-24','2026-08-25','2026-08-26','2026-08-27','2026-08-28'] },
      { id: '2026-09-W1', month: '2026-09', label: '第1週', dates: ['2026-08-31','2026-09-01','2026-09-02','2026-09-03','2026-09-04'] },
      { id: '2026-09-W2', month: '2026-09', label: '第2週', dates: ['2026-09-07','2026-09-08','2026-09-09','2026-09-10','2026-09-11'] },
      { id: '2026-09-W3', month: '2026-09', label: '第3週', dates: ['2026-09-14','2026-09-15','2026-09-16','2026-09-17','2026-09-18'] },
      { id: '2026-09-W4', month: '2026-09', label: '第4週', dates: ['2026-09-24','2026-09-25'] }, // 9/21-23は祝日等
      { id: '2026-10-W1', month: '2026-10', label: '第1週', dates: ['2026-09-28','2026-09-29','2026-09-30','2026-10-01','2026-10-02'] },
      { id: '2026-10-W2', month: '2026-10', label: '第2週', dates: ['2026-10-05','2026-10-06','2026-10-07','2026-10-08','2026-10-09'] },
      { id: '2026-10-W3', month: '2026-10', label: '第3週', dates: ['2026-10-13','2026-10-14','2026-10-15','2026-10-16'] }, // 10/12スポーツの日
      { id: '2026-10-W4', month: '2026-10', label: '第4週', dates: ['2026-10-19','2026-10-20','2026-10-21','2026-10-22','2026-10-23'] },
      { id: '2026-10-W5', month: '2026-10', label: '第5週', dates: ['2026-10-26','2026-10-27','2026-10-28','2026-10-29','2026-10-30'] }
    ];
    
    const dayNames = ['(日)', '(月)', '(火)', '(水)', '(木)', '(金)', '(土)'];

    // デフォルトデータの動的割り当て
    const generateDefaultSchedules = () => {
      const result = {};
      weeksData.forEach((week) => {
        week.dates.forEach((dateStr) => {
          const d = new Date(dateStr);
          const dayIndex = d.getDay() - 1; // 月=0, 火=1...
          if(dayIndex >= 0 && dayIndex <= 4) {
            result[dateStr] = JSON.parse(JSON.stringify(weeklyPattern[dayIndex]));
          }
        });
      });
      return result;
    };
    const defaultSchedules = generateDefaultSchedules();

    // ============================================================================
    // 状態管理 (State)
    // ============================================================================
    const state = {
      user: null,
      schedules: JSON.parse(JSON.stringify(defaultSchedules)),
      updatedAts: {}, // 各日の最終更新日時を保持
      selectedMonth: '2026-08',
      selectedWeek: '2026-08-W1',
      selectedDate: '2026-08-03',
      isAdmin: false,
      isEditing: false,
      editData: [],
      isLoading: true,
      isSaving: false,
      showLoginModal: false,
      loginError: '',
      passwordInput: ''
    };

    let activeInputId = null;
    let activeSelectionStart = 0;
    let activeSelectionEnd = 0;

    // ============================================================================
    // ユーティリティ関数
    // ============================================================================
    const getRoleColor = (role) => {
      if (role === '休暇者') return 'bg-rose-100 text-rose-800 border-rose-300';
      const externals = ['若林', '女川', '涌谷', '一番町', '健診', '刈田', '真壁', '矢本', '渡辺', '佐藤', 'ゆう', '高砂', '循環器', '葵会', '米谷'];
      if (externals.some(kw => role.includes(kw))) return 'bg-stone-100 text-stone-700 border-stone-300'; 
      if (role.includes('新患')) return 'bg-emerald-50 text-emerald-800 border-emerald-200';
      if (role.includes('EGD')) return 'bg-blue-50 text-blue-800 border-blue-200';
      if (role.includes('EUS')) return 'bg-purple-50 text-purple-800 border-purple-200';
      if (role.includes('CS')) return 'bg-orange-50 text-orange-800 border-orange-200';
      if (role.includes('AUS')) return 'bg-pink-50 text-pink-800 border-pink-200';
      if (role.includes('back up')) return 'bg-slate-700 text-white border-slate-800';
      return 'bg-white text-slate-700 border-slate-300'; // 臨時枠などは白
    };

    const PM_BOOTHS = ['若林午後CS', '午後CS', 'ゆうファミリー', '循環器センター'];
    const getPeriod = (role) => PM_BOOTHS.includes(role) ? 'PM' : 'AM';

    const checkConflicts = (booths) => {
      const staffMap = {}; 
      booths.forEach((booth, localIndex) => {
        if (!booth.staff) return;
        const names = booth.staff.split(/[\s,、・]+|or/).map(n => n.trim())
          .filter(n => n.length > 0 && n !== 'なし' && !n.includes('年目') && n !== 'back' && n !== 'up');
        const period = getPeriod(booth.role);
        names.forEach(name => {
          if (!staffMap[name]) staffMap[name] = [];
          staffMap[name].push({ role: booth.role, period, localIndex });
        });
      });

      const conflicts = {}; 
      Object.keys(staffMap).forEach(name => {
        const assignments = staffMap[name];
        if (assignments.length > 1) {
          const ams = assignments.filter(a => a.period === 'AM');
          const pms = assignments.filter(a => a.period === 'PM');
          const registerConflicts = (group) => {
            if (group.length > 1) {
              group.forEach(a => {
                if (!conflicts[a.localIndex]) conflicts[a.localIndex] = [];
                const others = group.filter(other => other.localIndex !== a.localIndex).map(other => other.role);
                if (!conflicts[a.localIndex].find(c => c.name === name)) {
                    conflicts[a.localIndex].push({ name, others });
                }
              });
            }
          };
          registerConflicts(ams);
          registerConflicts(pms);
        }
      });
      return conflicts;
    };

    const escapeHTML = (str) => {
      return String(str).replace(/[&<>"']/g, function(match) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[match];
      });
    };

    const formatDateTime = (isoString) => {
      if (!isoString) return '';
      const d = new Date(isoString);
      return `${d.getMonth()+1}/${d.getDate()} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
    };

    // ============================================================================
    // UI アクション
    // ============================================================================
    window.appUI = {
      handleMonthChange: (monthId) => {
        state.selectedMonth = monthId;
        const firstWeek = weeksData.find(w => w.month === monthId);
        state.selectedWeek = firstWeek.id;
        state.selectedDate = firstWeek.dates[0];
        state.isEditing = false;
        render();
      },
      handleWeekChange: (weekId) => {
        state.selectedWeek = weekId;
        state.selectedDate = weeksData.find(w => w.id === weekId).dates[0];
        state.isEditing = false;
        render();
      },
      handleDateChange: (date) => {
        state.selectedDate = date;
        state.isEditing = false;
        render();
      },
      handleEditStart: () => {
        state.editData = JSON.parse(JSON.stringify(state.schedules[state.selectedDate]));
        state.isEditing = true;
        render();
      },
      handleInputChange: (index, value) => {
        state.editData[index].staff = value;
        saveFocus();
        render();
      },
      handleCustomRoleChange: (index, value) => {
        state.editData[index].role = value;
        saveFocus();
        render();
      },
      addCustomBooth: () => {
        // 新規の臨時枠を追加
        state.editData.push({ role: '臨時枠', staff: '', isCustom: true });
        render();
      },
      removeCustomBooth: (index) => {
        state.editData.splice(index, 1);
        render();
      },
      handleCancel: () => {
        state.isEditing = false;
        render();
      },
      handleSave: async () => {
        if (!state.user) return;
        state.isSaving = true;
        render();
        try {
          const schedulesRef = collection(db, 'artifacts', 'gastro-schedule', 'public', 'data', COLLECTION_NAME);
          const docRef = doc(schedulesRef, state.selectedDate);
          
          await setDoc(docRef, {
            staffData: JSON.stringify(state.editData),
            updatedAt: new Date().toISOString(),
            updatedBy: state.user.uid
          });
          state.isEditing = false;
        } catch (error) {
          console.error("Error saving document: ", error);
          alert("保存に失敗しました。Firebaseの設定や権限を確認してください。");
        } finally {
          state.isSaving = false;
          render();
        }
      },
      openLoginModal: () => {
        state.showLoginModal = true;
        state.loginError = '';
        state.passwordInput = '';
        render();
      },
      closeLoginModal: () => {
        state.showLoginModal = false;
        render();
      },
      handlePasswordChange: (val) => {
        state.passwordInput = val;
      },
      handleLogin: (e) => {
        e.preventDefault();
        if (state.passwordInput === 'admin123') {
          state.isAdmin = true;
          state.showLoginModal = false;
          state.passwordInput = '';
          state.loginError = '';
        } else {
          state.loginError = 'パスワードが間違っています';
        }
        render();
      },
      handleLogout: () => {
        state.isAdmin = false;
        state.isEditing = false;
        render();
      },
      downloadCSV: () => {
        // Excel(CSV)出力機能
        const weekData = weeksData.find(w => w.id === state.selectedWeek);
        
        // Excelで文字化けしないようにBOMを付与
        let csvContent = "\uFEFF日付,曜日,役割,担当者\n";
        
        weekData.dates.forEach(dateStr => {
          const d = new Date(dateStr);
          const dayStr = dayNames[d.getDay()].replace(/[()]/g, ''); // 曜日文字だけ抽出
          
          const dataToExport = state.schedules[dateStr];
          dataToExport.forEach(item => {
            // カンマが含まれているとCSVが崩れるので全角に置換するかダブルクォーテーションで囲む
            const role = item.role.replace(/"/g, '""');
            const staff = item.staff.replace(/"/g, '""');
            csvContent += `${dateStr},${dayStr},"${role}","${staff}"\n`;
          });
        });

        // ダウンロード処理
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `業務表_${weekData.label}_${weekData.dates[0]}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }
    };

    function saveFocus() {
      const activeElem = document.activeElement;
      if(activeElem && activeElem.tagName === 'INPUT') {
          activeInputId = activeElem.id;
          activeSelectionStart = activeElem.selectionStart;
          activeSelectionEnd = activeElem.selectionEnd;
      } else {
          activeInputId = null;
      }
    }

    // ============================================================================
    // 描画関数 (HTML構築)
    // ============================================================================
    function render() {
      const appDiv = document.getElementById('app');
      
      if (state.isLoading) {
        appDiv.innerHTML = `
          <div class="min-h-screen flex items-center justify-center bg-slate-50">
            <div class="flex flex-col items-center gap-4 text-slate-500">
              <i data-lucide="loader-2" class="w-8 h-8 animate-spin text-blue-600"></i>
              <p class="text-sm font-medium">データを読み込んでいます...</p>
            </div>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      const currentMonthWeeks = weeksData.filter(w => w.month === state.selectedMonth);
      const currentWeekData = weeksData.find(w => w.id === state.selectedWeek);
      const activeData = state.isEditing ? state.editData : state.schedules[state.selectedDate];
      
      const leavesData = activeData[0] || { staff: '' };
      const boothsData = activeData.slice(1);
      const defaultBoothsData = defaultSchedules[state.selectedDate].slice(1);

      const leaveNames = leavesData.staff
        .split(/[\s,、・]+|or/)
        .map(name => name.trim())
        .filter(name => name.length > 0);

      const doubleBookingConflicts = checkConflicts(boothsData);
      
      const lastUpdatedStr = formatDateTime(state.updatedAts[state.selectedDate]);

      // --- HTML構築開始 ---
      let html = `
        <header class="bg-blue-800 text-white p-3 sm:p-4 shadow-md sticky top-0 z-30">
          <div class="max-w-4xl mx-auto flex justify-between items-start sm:items-center flex-col sm:flex-row gap-3">
            <div class="flex flex-col sm:flex-row sm:items-baseline gap-1 sm:gap-3">
              <div class="flex items-center gap-2">
                <i data-lucide="calendar" class="w-5 h-5 text-blue-200"></i>
                <h1 class="text-lg font-bold tracking-tight">業務変更表</h1>
              </div>
              ${lastUpdatedStr ? `
                <span class="text-xs text-blue-200/90 font-medium">
                  <i data-lucide="clock" class="inline w-3 h-3 mb-0.5"></i> 最終更新: ${lastUpdatedStr}
                </span>
              ` : ''}
            </div>
            
            <div class="flex items-center gap-2 self-end sm:self-auto">
              ${state.isAdmin ? `
                <button onclick="window.appUI.handleLogout()" class="flex items-center gap-1.5 text-xs bg-blue-900 hover:bg-blue-700 px-3 py-1.5 rounded-md transition-colors border border-blue-700">
                  <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
                  <span class="hidden sm:inline">ログアウト</span>
                </button>
              ` : `
                <button onclick="window.appUI.openLoginModal()" class="flex items-center gap-1.5 text-xs bg-blue-600 hover:bg-blue-500 px-3 py-1.5 rounded-md transition-colors shadow-sm border border-blue-500">
                  <i data-lucide="lock" class="w-3.5 h-3.5"></i>
                  <span class="hidden sm:inline">管理者</span>
                </button>
              `}
            </div>
          </div>
        </header>

        <main class="max-w-4xl mx-auto p-3 sm:p-4 pb-28">
          
          <!-- 月・週・日 ナビゲーション -->
          <div class="bg-white rounded-lg shadow-sm border border-slate-200 p-2 mb-4 sticky top-[72px] z-20">
            
            <!-- 上段：月切り替え ＆ Excelボタン -->
            <div class="flex justify-between items-center mb-2 pb-2 border-b border-slate-100">
              <select onchange="window.appUI.handleMonthChange(this.value)" class="p-1.5 rounded-md border-2 border-blue-200 text-sm font-bold bg-blue-50 text-blue-800 outline-none focus:border-blue-500">
                <option value="2026-08" ${state.selectedMonth === '2026-08' ? 'selected' : ''}>2026年 8月</option>
                <option value="2026-09" ${state.selectedMonth === '2026-09' ? 'selected' : ''}>2026年 9月</option>
                <option value="2026-10" ${state.selectedMonth === '2026-10' ? 'selected' : ''}>2026年 10月</option>
              </select>
              
              <button onclick="window.appUI.downloadCSV()" class="flex items-center gap-1.5 bg-emerald-600 text-white px-3 py-1.5 rounded-md text-xs font-bold hover:bg-emerald-700 transition-colors shadow-sm">
                <i data-lucide="download" class="w-3.5 h-3.5"></i> 
                <span class="hidden sm:inline">Excel(CSV)出力</span>
                <span class="sm:hidden">出力</span>
              </button>
            </div>

            <!-- 中段：週切り替え -->
            <div class="flex overflow-x-auto gap-1 pb-1.5 mb-1.5 border-b border-slate-100 hide-scrollbar">
              ${currentMonthWeeks.map(week => `
                <button onclick="window.appUI.handleWeekChange('${week.id}')" 
                  class="whitespace-nowrap px-3 py-1.5 rounded-md text-xs font-bold transition-colors ${state.selectedWeek === week.id ? 'bg-blue-100 text-blue-800' : 'text-slate-500 hover:bg-slate-100'}">
                  ${week.label}
                </button>
              `).join('')}
            </div>

            <!-- 下段：日切り替え -->
            <div class="flex overflow-x-auto gap-1.5 hide-scrollbar">
              ${currentWeekData.dates.map(dateStr => {
                const d = new Date(dateStr);
                const isSelected = state.selectedDate === dateStr;
                return `
                  <button onclick="window.appUI.handleDateChange('${dateStr}')" 
                    class="flex-1 min-w-[55px] flex flex-col items-center justify-center py-1.5 px-1 rounded-lg transition-all duration-200 border ${isSelected ? 'bg-blue-600 text-white border-blue-600 shadow-sm' : 'bg-slate-50 text-slate-600 hover:bg-slate-100 border-slate-200'}">
                    <span class="text-[10px] ${isSelected ? 'opacity-90' : 'text-slate-400'}">${d.getMonth()+1}/${d.getDate()}</span>
                    <span class="text-sm font-bold">${dayNames[d.getDay()]}</span>
                  </button>
                `;
              }).join('')}
            </div>
          </div>

          <!-- コントロールパネル -->
          ${(state.isAdmin && !state.isEditing) ? `
            <div class="bg-blue-50/50 rounded-lg border border-blue-200 p-3 mb-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
              <div class="flex items-center gap-1.5 text-blue-800">
                <i data-lucide="shield-alert" class="w-4 h-4"></i>
                <span class="font-bold text-xs">管理者モード</span>
              </div>
              <button onclick="window.appUI.handleEditStart()" class="flex items-center justify-center gap-1.5 bg-white border border-blue-600 text-blue-700 hover:bg-blue-600 hover:text-white px-4 py-2 rounded-md text-sm font-bold transition-colors w-full sm:w-auto shadow-sm">
                <i data-lucide="edit" class="w-3.5 h-3.5"></i>
                出番を変更・追加する
              </button>
            </div>
          ` : ''}

          <!-- 休暇者枠 -->
          <div class="bg-white rounded-lg shadow-sm border-2 border-rose-200 overflow-hidden mb-4">
            <div class="bg-rose-50 border-b border-rose-200 px-4 py-2.5 flex items-center gap-2">
              <span class="bg-rose-100 text-rose-800 text-xs px-2 py-1 rounded border border-rose-300 font-bold">休暇者</span>
              <span class="text-xs text-rose-600 font-medium">※カンマやスペース区切りで入力</span>
            </div>
            <div class="p-3">
              ${state.isEditing ? `
                <input type="text" id="input-0" placeholder="例: 片山, 遠藤" value="${escapeHTML(leavesData.staff)}" oninput="window.appUI.handleInputChange(0, this.value)" class="w-full p-2 border-2 border-rose-300 rounded-md outline-none focus:border-rose-500 transition-all font-medium text-sm bg-rose-50/30" />
              ` : `
                <div class="text-sm font-bold text-slate-800 min-h-[1.5rem] flex items-center">
                  ${escapeHTML(leavesData.staff) || '<span class="text-slate-400 font-normal">（なし）</span>'}
                </div>
              `}
            </div>
          </div>

          <!-- 業務表メイン -->
          <div class="bg-white rounded-lg shadow-sm border border-slate-300 overflow-hidden mb-8">
            <div class="bg-slate-100 border-b-2 border-slate-300 px-4 py-3 flex justify-between items-center">
              <h2 class="text-base font-black text-slate-700 flex items-center gap-1.5">
                ${parseInt(state.selectedDate.split('-')[1])}/${parseInt(state.selectedDate.split('-')[2])} 
                ${dayNames[new Date(state.selectedDate).getDay()]}
              </h2>
              ${state.isEditing ? `
                <span class="bg-amber-100 text-amber-800 text-[10px] px-2 py-0.5 rounded-full font-bold animate-pulse border border-amber-300 flex items-center gap-1">
                  <i data-lucide="edit" class="w-3 h-3"></i> 編集中
                </span>
              ` : ''}
            </div>

            <div class="divide-y-2 divide-slate-200">
              ${boothsData.map((item, localIndex) => {
                const dataIndex = localIndex + 1; // 休暇者が[0]なので+1
                
                // カスタム追加枠かどうかの判定
                const isCustom = item.isCustom;
                const defaultStaff = isCustom ? '' : (defaultBoothsData[localIndex]?.staff || '');
                const currentStaff = item.staff;
                
                // カスタム枠は無条件に変更あり(赤字)扱いにするか、入力されていれば赤字にする
                const changed = isCustom ? (currentStaff !== '') : (defaultStaff !== currentStaff);
                
                const conflictNames = leaveNames.filter(name => currentStaff.includes(name));
                const hasLeaveConflict = conflictNames.length > 0;
                const doubleBookings = doubleBookingConflicts[localIndex];
                const hasDoubleBooking = doubleBookings && doubleBookings.length > 0;
                const isError = hasLeaveConflict || hasDoubleBooking;
                
                return `
                  <div class="flex flex-col sm:flex-row items-stretch transition-colors ${isError ? 'bg-red-50' : (changed && !state.isEditing) ? 'bg-amber-50/40' : 'hover:bg-slate-50'}">
                    
                    <!-- 左側：役割バッジ -->
                    <div class="sm:w-1/3 p-2 sm:p-3 sm:border-r-2 border-slate-200 flex items-center justify-between sm:justify-start shrink-0 ${isError ? 'bg-red-100/50' : 'bg-slate-50/50'}">
                      ${(isCustom && state.isEditing) ? `
                        <input type="text" id="role-${dataIndex}" value="${escapeHTML(item.role)}" placeholder="枠名" oninput="window.appUI.handleCustomRoleChange(${dataIndex}, this.value)" class="w-full p-1.5 border-2 border-blue-300 rounded text-xs font-bold outline-none focus:border-blue-500 bg-white" />
                        <button onclick="window.appUI.removeCustomBooth(${dataIndex})" class="ml-2 text-red-500 hover:bg-red-100 p-1 rounded transition-colors" title="枠を削除">
                          <i data-lucide="x" class="w-4 h-4"></i>
                        </button>
                      ` : `
                        <span class="inline-block px-2 py-1 rounded text-xs font-bold border w-full sm:w-auto text-center sm:text-left ${getRoleColor(item.role)}">
                          ${escapeHTML(item.role)}
                        </span>
                      `}
                    </div>
                    
                    <!-- 右側：担当者名 -->
                    <div class="sm:w-2/3 p-2 sm:p-3 flex flex-col justify-center min-h-[3.5rem]">
                      ${state.isEditing ? `
                        <div class="w-full">
                          ${(changed && !isCustom) ? `
                            <div class="text-[10px] text-slate-400 mb-0.5 flex items-center gap-1">
                              基本: ${escapeHTML(defaultStaff)} <span class="text-amber-500 font-bold">(変更あり)</span>
                            </div>
                          ` : ''}
                          ${(isCustom) ? `
                            <div class="text-[10px] text-blue-500 mb-0.5 font-bold flex items-center gap-1">
                              <i data-lucide="plus" class="w-3 h-3"></i> 臨時追加枠
                            </div>
                          ` : ''}
                          
                          <input type="text" id="input-${dataIndex}" placeholder="担当者名" value="${escapeHTML(currentStaff)}" oninput="window.appUI.handleInputChange(${dataIndex}, this.value)" class="w-full p-2 border-2 rounded-md outline-none focus:border-blue-500 transition-all font-medium text-sm ${isError ? 'border-red-400 bg-red-50 text-red-900' : changed ? 'border-amber-300 bg-amber-50' : 'border-slate-300 bg-white'}" />
                          
                          ${hasLeaveConflict ? `
                            <div class="text-red-600 text-[10px] font-bold mt-1 flex items-center gap-1">
                              <i data-lucide="alert-triangle" class="w-3 h-3"></i> 休暇者 (${escapeHTML(conflictNames.join(', '))}) が含まれています
                            </div>
                          ` : ''}
                          ${hasDoubleBooking ? doubleBookings.map(db => `
                            <div class="text-red-600 text-[10px] font-bold mt-1 flex items-center gap-1">
                              <i data-lucide="alert-triangle" class="w-3 h-3"></i> 重複: ${escapeHTML(db.name)} (他: ${escapeHTML(db.others.join(', '))})
                            </div>
                          `).join('') : ''}
                        </div>
                      ` : `
                        <div class="flex items-center justify-between w-full">
                          <div class="flex flex-col">
                            ${(changed || isCustom) ? `
                              ${(!isCustom) ? `
                                <div class="flex items-center gap-1 text-slate-400 text-[10px] font-medium mb-0.5">
                                  <span class="line-through decoration-slate-400">${escapeHTML(defaultStaff)}</span>
                                  <i data-lucide="arrow-right" class="w-2.5 h-2.5"></i>
                                </div>
                              ` : `
                                <div class="text-[10px] text-blue-500 font-bold mb-0.5">臨時追加枠</div>
                              `}
                              <span class="text-base sm:text-lg font-black drop-shadow-sm ${isError ? 'text-red-700' : 'text-red-600'}">
                                ${escapeHTML(currentStaff) || '<span class="text-slate-300">未入力</span>'}
                              </span>
                            ` : `
                              <span class="text-sm font-bold ${isError ? 'text-red-700' : 'text-slate-800'}">
                                ${escapeHTML(currentStaff)}
                              </span>
                            `}
                            
                            ${hasLeaveConflict ? `
                              <div class="text-red-600 text-[10px] font-bold mt-0.5 flex items-center gap-1">
                                <i data-lucide="alert-triangle" class="w-3 h-3"></i> 休暇者 (${escapeHTML(conflictNames.join(', '))}) が含まれています
                              </div>
                            ` : ''}
                            ${hasDoubleBooking ? doubleBookings.map(db => `
                              <div class="text-red-600 text-[10px] font-bold mt-0.5 flex items-center gap-1">
                                <i data-lucide="alert-triangle" class="w-3 h-3"></i> 重複: ${escapeHTML(db.name)} (他: ${escapeHTML(db.others.join(', '))})
                              </div>
                            `).join('') : ''}
                          </div>
                          
                          <div class="flex gap-1 shrink-0 ml-2">
                            ${isError ? `
                              <span class="inline-flex items-center gap-1 bg-red-600 text-white text-[10px] px-1.5 py-0.5 rounded font-bold shadow-sm">
                                <i data-lucide="alert-triangle" class="w-3 h-3"></i>
                                <span class="hidden sm:inline">アラート</span>
                              </span>
                            ` : ''}
                            ${(changed && !isError) ? `
                              <span class="inline-flex items-center gap-1 bg-amber-100 text-amber-700 text-[10px] px-1.5 py-0.5 rounded font-bold border border-amber-300">
                                <i data-lucide="alert-circle" class="w-3 h-3"></i>
                                <span class="hidden sm:inline">変更あり</span>
                              </span>
                            ` : ''}
                          </div>
                        </div>
                      `}
                    </div>
                  </div>
                `;
              }).join('')}
              
              <!-- 臨時枠追加ボタン (編集時のみ一番下に表示) -->
              ${state.isEditing ? `
                <div class="p-4 bg-slate-50 flex justify-center">
                  <button onclick="window.appUI.addCustomBooth()" class="flex items-center gap-1.5 bg-white border-2 border-dashed border-blue-300 text-blue-600 hover:bg-blue-50 hover:border-blue-500 px-6 py-2.5 rounded-lg text-sm font-bold transition-colors w-full sm:w-auto shadow-sm">
                    <i data-lucide="plus" class="w-4 h-4"></i> 臨時枠（ブース）を追加
                  </button>
                </div>
              ` : ''}

            </div>
          </div>

          <!-- 保存/キャンセル ボタン -->
          ${state.isEditing ? `
            <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-300 p-3 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.1)] z-40">
              <div class="max-w-4xl mx-auto flex justify-end gap-2">
                <button onclick="window.appUI.handleCancel()" ${state.isSaving ? 'disabled' : ''} class="px-4 py-2 rounded-md text-sm font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 transition-colors disabled:opacity-50 border border-slate-300">
                  キャンセル
                </button>
                <button onclick="window.appUI.handleSave()" ${state.isSaving ? 'disabled' : ''} class="flex items-center gap-1.5 px-6 py-2 rounded-md text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 shadow-sm transition-colors disabled:opacity-50">
                  ${state.isSaving ? '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>' : '<i data-lucide="save" class="w-4 h-4"></i>'}
                  ${state.isSaving ? '保存中...' : '変更を保存'}
                </button>
              </div>
            </div>
          ` : ''}
        </main>

        <!-- ログインモーダル -->
        ${state.showLoginModal ? `
          <div class="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
            <div class="bg-white rounded-xl shadow-xl w-full max-w-sm overflow-hidden animate-in fade-in zoom-in-95 duration-200">
              <div class="flex justify-between items-center p-4 border-b border-slate-200 bg-slate-50">
                <h3 class="font-bold text-sm flex items-center gap-1.5 text-slate-800">
                  <i data-lucide="lock" class="w-4 h-4 text-blue-600"></i>
                  管理者ログイン
                </h3>
                <button onclick="window.appUI.closeLoginModal()" class="p-1 hover:bg-slate-200 rounded text-slate-500 transition-colors">
                  <i data-lucide="x" class="w-4 h-4"></i>
                </button>
              </div>
              
              <form onsubmit="window.appUI.handleLogin(event)" class="p-5">
                <p class="text-xs text-slate-600 mb-4 leading-relaxed">
                  出番を変更するにはパスワードを入力してください。<br/>
                  <span class="inline-block mt-1.5 px-1.5 py-0.5 bg-blue-50 text-blue-700 rounded font-bold border border-blue-200">
                    パスワード: admin123
                  </span>
                </p>
                
                <div class="mb-5">
                  <input type="password" placeholder="パスワード" value="${escapeHTML(state.passwordInput)}" oninput="window.appUI.handlePasswordChange(this.value)" class="w-full p-2.5 border-2 border-slate-300 rounded-md outline-none focus:border-blue-500 transition-all text-sm font-medium" autofocus />
                  ${state.loginError ? `
                    <p class="text-red-600 text-xs mt-1.5 flex items-center gap-1 font-bold">
                      <i data-lucide="alert-circle" class="w-3.5 h-3.5"></i>
                      ${escapeHTML(state.loginError)}
                    </p>
                  ` : ''}
                </div>
                
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-md shadow-sm transition-colors text-sm">
                  ログイン
                </button>
              </form>
            </div>
          </div>
        ` : ''}
      `;

      appDiv.innerHTML = html;
      lucide.createIcons();

      // フォーカスの復元
      if (activeInputId) {
        const el = document.getElementById(activeInputId);
        if (el) {
          el.focus();
          try { el.setSelectionRange(activeSelectionStart, activeSelectionEnd); } catch(e){}
        }
      }
    }

    // ============================================================================
    // データ初期化・リスナー登録
    // ============================================================================
    const initAuth = async () => {
      try {
        await signInAnonymously(auth);
      } catch (error) {
        console.error("Auth error:", error);
        state.isLoading = false;
        render();
      }
    };
    initAuth();

    onAuthStateChanged(auth, (currentUser) => {
      state.user = currentUser;
      if (!currentUser) {
        state.isLoading = false;
        render();
      } else {
        // カレンダー全日分のデータをFirestoreから監視
        Object.keys(defaultSchedules).forEach(dateKey => {
          const docRef = doc(db, 'artifacts', 'gastro-schedule', 'public', 'data', COLLECTION_NAME, dateKey);
          onSnapshot(docRef, 
            (snapshot) => {
              if (snapshot.exists()) {
                const data = snapshot.data();
                const parsedStaffData = JSON.parse(data.staffData);
                state.schedules[dateKey] = parsedStaffData;
                state.updatedAts[dateKey] = data.updatedAt; // 最終更新日時を記録
              } else {
                state.schedules[dateKey] = defaultSchedules[dateKey];
              }
              state.isLoading = false;
              
              if (!state.isEditing) {
                render();
              }
            },
            (error) => {
              console.error(`Error fetching:`, error);
              state.isLoading = false;
              render();
            }
          );
        });
      }
    });

  </script>
</body>
</html>
