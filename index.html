    // --- 月に準じた週分割ロジック ---
    const generateWeeks = () => {
      const weeks = [];
      let startDate = new Date('2026-08-01');
      const endDate = new Date('2026-10-31');
      
      let currentMonth = -1;
      let weekIdCounter = 1;
      let currentWeek = null;

      for (let d = new Date(startDate); d <= endDate; d.setDate(d.getDate() + 1)) {
        const dayOfWeek = d.getDay();
        if (dayOfWeek === 0 || dayOfWeek === 6) continue;

        const month = d.getMonth() + 1;
        
        if (month !== currentMonth) {
          currentMonth = month;
          currentWeek = {
            id: `week_${currentMonth}_${weekIdCounter++}`,
            month: currentMonth,
            dates: []
          };
          weeks.push(currentWeek);
        } else if (dayOfWeek === 1 && currentWeek.dates.length > 0) {
          currentWeek = {
            id: `week_${currentMonth}_${weekIdCounter++}`,
            month: currentMonth,
            dates: []
          };
          weeks.push(currentWeek);
        }
        
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        currentWeek.dates.push(`${yyyy}-${mm}-${dd}`);
      }

      weeks.forEach(week => {
        if (week.dates.length > 0) {
          const firstDate = new Date(week.dates[0]);
          const lastDate = new Date(week.dates[week.dates.length - 1]);
          if (week.dates.length === 1) {
             const days = ['日', '月', '火', '水', '木', '金', '土'];
             week.label = `${firstDate.getMonth() + 1}/${firstDate.getDate()}(${days[firstDate.getDay()]})`;
          } else {
             week.label = `${firstDate.getMonth() + 1}/${firstDate.getDate()} 〜 ${lastDate.getMonth() + 1}/${lastDate.getDate()}`;
          }
        }
      });
      return weeks.filter(w => w.dates.length > 0);
    };
    
    const weeksData = generateWeeks();

    };

    const PM_BOOTHS = ['若林午後CS', '若林CS', '午後CS', 'ゆうファミリー', '循環器センター'];
    const getPeriod = (role) => (PM_BOOTHS.includes(role) || role.includes('午後')) ? 'PM' : 'AM';

    // 検診枠（EGD②）の許可スタッフ
    const VALID_EGD2_STAFF = ['福士', '片山', '金', '伊藤', '宮下', '大沼', '早川', '及川', '永井', '佐々木'];

    const checkConflicts = (booths) => {
      const staffMap = {}; 
      booths.forEach((booth, localIndex) => {
        // ★ 上部EUS は被ってもアラートなしのため、重複チェックから除外
        if (!booth.staff || booth.role === '上部EUS') return; 
        
        const names = booth.staff.split(/[\s,、・]+|or/).map(n => n.trim()).filter(n => n.length > 0 && n !== 'なし' && !n.includes('年目') && n !== 'back' && n !== 'up');
        const period = getPeriod(booth.role);
        names.forEach(name => {
          if (!staffMap[name]) staffMap[name] = [];
          staffMap[name].push({ role: booth.role, period, localIndex });
        });
      });

      const conflicts = {}; 
      Object.keys(staffMap).forEach(name => {
        const assignments = staffMap[name];
        if (assignments.length > 1) {
          const ams = assignments.filter(a => a.period === 'AM');
          const pms = assignments.filter(a => a.period === 'PM');
          
          const registerConflicts = (group) => {
            if (group.length > 1) {
              group.forEach(a => {
                if (!conflicts[a.localIndex]) conflicts[a.localIndex] = [];
                const others = group.filter(other => other.localIndex !== a.localIndex).map(other => other.role);
                if (!conflicts[a.localIndex].find(c => c.name === name)) {
                    conflicts[a.localIndex].push({ name, others });
                }
              });
            }
          };
          registerConflicts(ams);
          registerConflicts(pms);
        }
      });
      return conflicts;
    };

    // --- メインコンポーネント ---
    function App() {
      const [user, setUser] = useState(null);
      const [schedules, setSchedules] = useState(defaultSchedules);
      const [schedulesMetadata, setSchedulesMetadata] = useState({});
      
      const [selectedMonth, setSelectedMonth] = useState(8);
      const [selectedWeek, setSelectedWeek] = useState(weeksData[0].id);
      const [selectedDate, setSelectedDate] = useState(weeksData[0].dates[0]);
      
      const [isAdmin, setIsAdmin] = useState(false);
      
      const [isEditMode, setIsEditMode] = useState(false);
      const [pendingChanges, setPendingChanges] = useState({});
      
      const [isLoading, setIsLoading] = useState(true);
      const [isSaving, setIsSaving] = useState(false);
      
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [password, setPassword] = useState('');
      const [loginError, setLoginError] = useState('');

      useEffect(() => {
        const initAuth = async () => {
          try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }
          } catch (error) {
            console.error("Auth error:", error);
            try {
              await signInAnonymously(auth); // トークンエラー時は匿名ログインにフォールバック
            } catch(e) {
              setIsLoading(false);
            }
          }
        };
        initAuth();

        const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
          setUser(currentUser);
          if (!currentUser) setIsLoading(false);
        });

        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!user) return;
        const schedulesRef = collection(db, 'artifacts', APP_ID, 'public', 'data', COLLECTION_NAME);
        
        const unsubscribers = Object.keys(defaultSchedules).map(dateKey => {
          const docRef = doc(schedulesRef, dateKey);
          return onSnapshot(docRef, 
            (snapshot) => {
              if (snapshot.exists()) {
                const data = snapshot.data();
                const parsedStaffData = JSON.parse(data.staffData);
                setSchedules(prev => ({ ...prev, [dateKey]: parsedStaffData }));
                setSchedulesMetadata(prev => ({ ...prev, [dateKey]: data.updatedAt }));
              } else {
                setSchedules(prev => ({ ...prev, [dateKey]: defaultSchedules[dateKey] }));
                setSchedulesMetadata(prev => ({ ...prev, [dateKey]: null }));
              }
              setIsLoading(false);
            },
            (error) => {
              console.error(`Error fetching schedule for ${dateKey}:`, error);
              setIsLoading(false);
            }
          );
        });

        return () => unsubscribers.forEach(unsub => unsub());
      }, [user]);

      const handleMonthChange = (month) => {
        setSelectedMonth(month);
        const firstWeekOfMonth = weeksData.find(w => w.month === month);
        handleWeekChange(firstWeekOfMonth.id);
      };

      const handleWeekChange = (weekId) => {
        setSelectedWeek(weekId);
        const firstDateOfWeek = weeksData.find(w => w.id === weekId).dates[0];
        setSelectedDate(firstDateOfWeek);
      };

      const handleDateChange = (date) => {
        setSelectedDate(date);
      };

      const activeData = pendingChanges[selectedDate] 
        ? pendingChanges[selectedDate] 
        : JSON.parse(JSON.stringify(schedules[selectedDate] || defaultSchedules[selectedDate]));

      const updatePendingChanges = (newData) => {
        setPendingChanges(prev => ({ ...prev, [selectedDate]: newData }));
      };

      const handleEditStart = () => setIsEditMode(true);

      const handleInputChange = (index, newValue) => {
        const newData = [...activeData];
        newData[index] = { ...newData[index], staff: newValue };
        updatePendingChanges(newData);
      };

      const handleRoleChange = (index, newRole) => {
        const newData = [...activeData];
        newData[index] = { ...newData[index], role: newRole };
        updatePendingChanges(newData);
      };

      const handleAddBooth = () => {
        const newData = [...activeData];
        newData.push({ role: '臨時枠', staff: '' });
        updatePendingChanges(newData);
      };

      const handleRemoveBooth = (index) => {
        if (!confirm('この枠を削除してもよろしいですか？')) return;
        const newData = [...activeData];
        newData.splice(index, 1);
        updatePendingChanges(newData);
      };

      const handleSave = async () => {
        if (!user) return;
        setIsSaving(true);
        try {
          const schedulesRef = collection(db, 'artifacts', APP_ID, 'public', 'data', COLLECTION_NAME);
          const promises = Object.keys(pendingChanges).map(dateKey => {
            const docRef = doc(schedulesRef, dateKey);
            return setDoc(docRef, {
              staffData: JSON.stringify(pendingChanges[dateKey]),
              updatedAt: new Date().toISOString(),
              updatedBy: user.uid
            });
          });
          
          await Promise.all(promises);
          setPendingChanges({}); 
          setIsEditMode(false);
        } catch (error) {
          console.error("Error saving document: ", error);
          alert("保存に失敗しました。");
        } finally {
          setIsSaving(false);
        }
      };

      const handleCancel = () => {
        if (Object.keys(pendingChanges).length > 0) {
          if (!confirm('変更内容が破棄されますがよろしいですか？')) return;
        }
        setPendingChanges({});
        setIsEditMode(false);
      };

      const handleExportExcel = () => {
        const week = weeksData.find(w => w.id === selectedWeek);
        const dates = week.dates;
        
        // その週に存在する全てのユニークな役割(ブース)を抽出
        const allRoles = [];
        dates.forEach(d => {
          const dayData = pendingChanges[d] || schedules[d] || defaultSchedules[d];
          dayData.forEach(item => {
            if (!allRoles.includes(item.role)) allRoles.push(item.role);
          });
        });

        // 役割の並び順を定義（新患④が新患③の次に来るように、論理的な順序を設定）
        const roleOrder = [
          '休暇者',
          '新患①', '新患②', '新患③', '新患④',
          'EGD①', 'EGD②', 'EGD③',
          'EUS', '上部EUS',
          'CS①', 'CS②', '透視CS', '午後CS', '若林CS', '若林午後CS',
          '専攻医AUS',
          'back up',
          '若林EGD', '仙台健診', '一番町', '涌谷', '刈田病院', '真壁病院', '矢本内科',
          '健診プラザ', '渡辺病院', '佐藤胃腸外科', 'ゆうファミリー', '女川EGD&CS',
          '高砂内科', '循環器センター', '葵会EGD', '米谷病院'
        ];

        // 抽出した役割を定義した順序にソート（定義にない新規枠は右端へ）
        allRoles.sort((a, b) => {
          let indexA = roleOrder.indexOf(a);
          let indexB = roleOrder.indexOf(b);
          if (indexA === -1) indexA = 999;
          if (indexB === -1) indexB = 999;
          if (indexA !== indexB) return indexA - indexB;
          return a.localeCompare(b);
        });

        // 行1: ヘッダー (縦に日付、横にブース)
        const header = ['日付', ...allRoles];
        const data = [header];
        
        // 列幅の初期設定
        const colWidths = [{ wch: 12 }]; // 日付列の幅
        allRoles.forEach((role) => {
          colWidths.push({ wch: Math.max(10, role.length * 2) }); // ブース名から初期幅を計算
        });

        // 行2以降: 各日付のデータ
        dates.forEach(d => {
          const rowData = pendingChanges[d] || schedules[d] || defaultSchedules[d];
          const defaultData = defaultSchedules[d] || [];
          
          const row = [ `${d.split('-')[1]}/${d.split('-')[2]}${getDayName(d)}` ];
          
          allRoles.forEach((role, i) => {
            const currentItem = rowData.find(item => item.role === role);
            const defaultItem = defaultData.find(item => item.role === role);
            
            // その曜日に元々存在せず、追加もされていないブースは空欄にする
            if (!currentItem && !defaultItem) {
              row.push({ v: "", t: 's', s: { alignment: { vertical: "center" } } });
              return;
            }

            const currentStaff = currentItem ? currentItem.staff : '';
            const defaultStaff = defaultItem ? defaultItem.staff : null;
            
            let cellValue = currentStaff;
            let isRed = false;

            if (defaultStaff === null) {
              // 元々ない枠が追加されている場合
              if (currentStaff !== '') {
                isRed = true;
                cellValue = `【追加枠】\n${currentStaff}`;
              } else {
                cellValue = ""; // 追加されたが空欄の場合
              }
            } else {
              // 元々ある枠に変更があった場合
              if (currentStaff !== defaultStaff) {
                isRed = true;
                if (role === '休暇者') {
                  // 休暇者の場合は「旧・新」の記載を省き、現在の内容のみ出力
                  cellValue = currentStaff;
                } else {
                  cellValue = `旧: ${defaultStaff}\n新: ${currentStaff || '(なし)'}`;
                }
              }
            }
            
            // 最大文字数から列幅を調整 (全角を2文字換算)
            const lines = cellValue.split('\n');
            const maxLineLen = Math.max(...lines.map(l => l.replace(/[^\x01-\x7E]/g, 'xx').length));
            const estWidth = maxLineLen + 2; 
            if (estWidth > colWidths[i + 1].wch) {
               colWidths[i + 1].wch = Math.min(estWidth, 30); // 幅が広がりすぎないよう最大30に制限
            }

            // セルオブジェクトの生成 (スタイル付き)
            if (isRed) {
              row.push({
                v: cellValue,
                t: 's',
                s: {
                  font: { color: { rgb: "FF0000" }, bold: true }, // 赤字・太字
                  alignment: { wrapText: true, vertical: "center" } // 折り返し
                }
              });
            } else {
               row.push({
                v: cellValue,
                t: 's',
                s: {
                  alignment: { wrapText: true, vertical: "center" }
                }
              });
            }
          });
          data.push(row);
        });

        // ヘッダー行のスタイル適用
        const headerRow = data[0].map(h => ({
            v: h,
            t: 's',
            s: {
                font: { bold: true },
                fill: { fgColor: { rgb: "E2E8F0" } }, // グレーの背景
                alignment: { horizontal: "center", vertical: "center" },
                border: { bottom: { style: "thin", color: { rgb: "94A3B8" } } }
            }
        }));
        data[0] = headerRow;

        const ws = XLSX.utils.aoa_to_sheet(data);
        ws['!cols'] = colWidths; // 計算した列幅を適用

        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "スケジュール");
        XLSX.writeFile(wb, `業務変更表_${dates[0].replace(/-/g, '')}.xlsx`);
      };

      const handleLogin = (e) => {
        e.preventDefault();
        if (password === '5101') {
          setIsAdmin(true);
          setShowLoginModal(false);
          setPassword('');
          setLoginError('');
        } else {
          setLoginError('パスワードが間違っています');
        }
      };

      if (isLoading) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-slate-50">
            <div className="flex flex-col items-center gap-4 text-slate-500">
              <IconLoader2 className="w-8 h-8 text-blue-600" />
              <p className="text-sm font-medium">データを読み込んでいます...</p>
            </div>
          </div>
        );
      }

      const currentWeekData = weeksData.find(w => w.id === selectedWeek);

      const leavesData = activeData[0] || { role: '休暇者', staff: '' };
      const boothsData = activeData.slice(1);
      const defaultBoothsData = defaultSchedules[selectedDate].slice(1);

      const leaveNames = leavesData.staff.split(/[\s,、・]+|or/).map(name => name.trim()).filter(name => name.length > 0);
      const doubleBookingConflicts = checkConflicts(boothsData);

      const currentMetadata = schedulesMetadata[selectedDate];
      const updatedAtStr = currentMetadata 
        ? new Date(currentMetadata).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })
        : '未更新';

      const changedDaysCount = Object.keys(pendingChanges).length;
      
      // 当日の曜日 (1=月, 2=火, 3=水, 4=木, 5=金)
      const currentDayOfWeek = new Date(selectedDate).getDay();

      return (
        <div>
          <header className="bg-blue-800 text-white p-3 sm:p-4 shadow-md sticky top-0 z-30">
            <div className="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
              <div className="flex items-center gap-2">
                <IconCalendar className="w-5 h-5 text-blue-200" />
                <h1 className="text-lg font-bold tracking-tight">
                  業務変更表 <span className="text-sm font-normal opacity-90 ml-1">{selectedMonth}月</span>
                </h1>
              </div>
              <div className="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-end">
                <div className="flex items-center gap-1 text-xs text-blue-200 bg-blue-900/50 px-2 py-1 rounded">
                  <IconClock className="w-3.5 h-3.5" />
                  <span>最終更新: {updatedAtStr}</span>
                </div>
                {isAdmin ? (
                  <button onClick={() => { setIsAdmin(false); setIsEditMode(false); setPendingChanges({}); }} className="flex items-center gap-1.5 text-xs bg-blue-900 hover:bg-blue-700 px-3 py-1.5 rounded-md transition-colors border border-blue-700">
                    <IconLogOut className="w-3.5 h-3.5" />
                    <span className="hidden sm:inline">ログアウト</span>
                  </button>
                ) : (
                  <button onClick={() => setShowLoginModal(true)} className="flex items-center gap-1.5 text-xs bg-blue-600 hover:bg-blue-500 px-3 py-1.5 rounded-md transition-colors shadow-sm border border-blue-500">
                    <IconLock className="w-3.5 h-3.5" />
                    <span className="hidden sm:inline">管理者</span>
                  </button>
                )}
              </div>
            </div>
          </header>

          <main className="max-w-4xl mx-auto p-3 sm:p-4 pb-28">
            
            <div className="bg-white rounded-lg shadow-sm border border-slate-200 p-2 mb-4 sticky top-[72px] sm:top-[60px] z-20">
              <div className="flex overflow-x-auto gap-2 pb-2 mb-2 border-b border-slate-100 hide-scrollbar">
                {months.map(month => (
                  <button
                    key={month}
                    onClick={() => handleMonthChange(month)}
                    className={`px-4 py-1 rounded-full text-sm font-bold transition-colors ${
                      selectedMonth === month ? 'bg-blue-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                    }`}
                  >
                    {month}月
                  </button>
                ))}
              </div>

              <div className="flex justify-between items-center mb-1.5 gap-2">
                <div className="flex overflow-x-auto gap-1 hide-scrollbar">
                  {weeksData.filter(w => w.month === selectedMonth).map((week) => (
                    <button
                      key={week.id}
                      onClick={() => handleWeekChange(week.id)}
                      className={`whitespace-nowrap px-3 py-1 rounded text-xs font-bold transition-colors border ${
                        selectedWeek === week.id 
                          ? 'bg-blue-100 text-blue-800 border-blue-200 shadow-sm' 
                          : 'text-slate-600 border-transparent hover:bg-slate-100'
                      }`}
                    >
                      {week.label}
                    </button>
                  ))}
                </div>
                <button
                  onClick={handleExportExcel}
                  className="flex items-center gap-1 text-xs bg-emerald-50 text-emerald-700 hover:bg-emerald-100 border border-emerald-200 px-2 py-1.5 rounded shrink-0 transition-colors font-bold shadow-sm"
                  title="表示されている期間をExcelに出力"
                >
                  <IconDownload className="w-3.5 h-3.5" />
                  <span className="hidden sm:inline">Excel出力</span>
                </button>
              </div>

              <div className="flex overflow-x-auto gap-1.5 hide-scrollbar mt-2">
                {currentWeekData.dates.map((dateStr) => {
                  const [, month, day] = dateStr.split('-');
                  const isSelected = selectedDate === dateStr;
                  const hasChanges = pendingChanges[dateStr];
                  
                  return (
                    <button
                      key={dateStr}
                      onClick={() => handleDateChange(dateStr)}
                      className={`relative flex-1 min-w-[55px] flex flex-col items-center justify-center py-1.5 px-1 rounded-lg transition-all duration-200 border ${
                        isSelected ? 'bg-blue-600 text-white border-blue-600 shadow-sm' : 'bg-slate-50 text-slate-600 hover:bg-slate-100 border-slate-200'
                      }`}
                    >
                      {hasChanges && !isSelected && (
                        <span className="absolute -top-1 -right-1 w-2.5 h-2.5 bg-amber-400 rounded-full border border-white"></span>
                      )}
                      <span className={`text-[10px] ${isSelected ? 'opacity-90' : 'text-slate-400'}`}>{parseInt(month)}/{parseInt(day)}</span>
                      <span className="text-sm font-bold">{getDayName(dateStr)}</span>
                    </button>
                  );
                })}
              </div>
            </div>

            {isAdmin && !isEditMode && (
              <div className="bg-blue-50/50 rounded-lg border border-blue-200 p-3 mb-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                <div className="flex items-center gap-1.5 text-blue-800">
                  <IconShieldAlert className="w-4 h-4" />
                  <span className="font-bold text-xs">管理者モード</span>
                </div>
                <button 
                  onClick={handleEditStart}
                  className="flex items-center justify-center gap-1.5 bg-white border border-blue-600 text-blue-700 hover:bg-blue-600 hover:text-white px-4 py-2 rounded-md text-sm font-bold transition-colors w-full sm:w-auto shadow-sm"
                >
                  <IconEdit className="w-3.5 h-3.5" />
                  出番・枠を変更する
                </button>
              </div>
            )}

            <div className="bg-white rounded-lg shadow-sm border-2 border-rose-200 overflow-hidden mb-4">
              <div className="bg-rose-50 border-b border-rose-200 px-4 py-2.5 flex items-center justify-between">
                <div className="flex items-center gap-2">
                  <span className="bg-rose-100 text-rose-800 text-xs px-2 py-1 rounded border border-rose-300 font-bold">休暇者</span>
                  <span className="text-xs text-rose-600 font-medium">※カンマやスペース区切りで入力</span>
                </div>
              </div>
              <div className="p-3">
                {isEditMode ? (
                  <input
                    type="text"
                    placeholder="例: 片山, 遠藤"
                    value={leavesData.staff}
                    onChange={(e) => handleInputChange(0, e.target.value)}
                    className="w-full p-2 border-2 border-rose-300 rounded-md outline-none focus:border-rose-500 transition-all font-medium text-sm bg-rose-50/30"
                  />
                ) : (
                  <div className="text-sm font-bold text-slate-800 min-h-[1.5rem] flex items-center">
                    {leavesData.staff || <span className="text-slate-400 font-normal">（なし）</span>}
                  </div>
                )}
              </div>
            </div>

            <div className="bg-white rounded-lg shadow-sm border border-slate-300 overflow-hidden mb-8">
              <div className="bg-slate-100 border-b-2 border-slate-300 px-4 py-3 flex justify-between items-center">
                <h2 className="text-base font-black text-slate-700 flex items-center gap-1.5">
                  {parseInt(selectedDate.split('-')[1])}/{parseInt(selectedDate.split('-')[2])} 
                  {getDayName(selectedDate)}
                </h2>
                {isEditMode && (
                  <span className="bg-amber-100 text-amber-800 text-[10px] px-2 py-0.5 rounded-full font-bold animate-pulse border border-amber-300 flex items-center gap-1">
                    <IconEdit className="w-3 h-3" /> 編集中
                  </span>
                )}
              </div>

              <div className="flex flex-col">
                {boothsData.map((item, localIndex) => {
                  const dataIndex = localIndex + 1;
                  
                  const isNewBooth = !defaultSchedules[selectedDate].some(defaultItem => defaultItem.role === item.role);
                  const defaultStaffObj = defaultSchedules[selectedDate].find(d => d.role === item.role);
                  const defaultStaff = defaultStaffObj ? defaultStaffObj.staff : null;
                  
                  const currentStaff = item.staff;
                  const changed = isNewBooth || defaultStaff !== currentStaff;
                  
                  const conflictNames = leaveNames.filter(name => currentStaff.includes(name));
                  const hasLeaveConflict = conflictNames.length > 0;
                  const doubleBookings = doubleBookingConflicts[localIndex];
                  const hasDoubleBooking = doubleBookings && doubleBookings.length > 0;
                  
                  // ★ EGD②の専用バリデーション (火水木のみ)
                  let egd2Error = null;
                  if (item.role === 'EGD②' && [2, 3, 4].includes(currentDayOfWeek) && currentStaff) {
                    const names = currentStaff.split(/[\s,、・]+|or/).map(n => n.trim()).filter(n => n.length > 0 && n !== 'なし');
                    const invalidNames = names.filter(n => !VALID_EGD2_STAFF.includes(n));
                    if (invalidNames.length > 0) {
                      egd2Error = `検診枠です。検診登録医の入力をして下さい。(${invalidNames.join(', ')})`;
                    }
                  }

                  const isError = hasLeaveConflict || hasDoubleBooking || egd2Error;
                  
                  const rowClass = `relative flex flex-col sm:flex-row items-stretch transition-colors border-b border-slate-200 last:border-b-0 ${
                    isError ? 'bg-red-50' : isNewBooth ? 'bg-fuchsia-50/60' : changed && !isEditMode ? 'bg-amber-50/40' : 'hover:bg-slate-50'
                  }`;

                  return (
                    <div key={dataIndex} className={rowClass}>
                      {isNewBooth && <div className="absolute left-0 top-0 bottom-0 w-1.5 bg-fuchsia-400 z-10"></div>}

                      <div className={`sm:w-1/3 p-2 sm:p-3 sm:border-r border-slate-200 flex flex-col justify-center shrink-0 ${
                        isError ? 'bg-red-100/50' : isNewBooth ? 'bg-fuchsia-100/40 pl-3.5' : 'bg-slate-50/50'
                      }`}>
                        {isEditMode ? (
                          <div className="flex items-center gap-2">
                            <input 
                              type="text" 
                              value={item.role}
                              onChange={(e) => handleRoleChange(dataIndex, e.target.value)}
                              className={`w-full border rounded px-2 py-1.5 text-xs font-bold outline-none transition-colors ${
                                isNewBooth ? 'bg-fuchsia-50 border-fuchsia-300 text-fuchsia-900 focus:border-fuchsia-500' : 'bg-white border-slate-300 text-slate-700 focus:border-blue-500'
                              }`}
                              placeholder="枠名を入力"
                            />
                            <button onClick={() => handleRemoveBooth(dataIndex)} className="text-slate-400 hover:text-red-500 p-1" title="枠を削除">
                              <IconTrash2 className="w-4 h-4" />
                            </button>
                          </div>
                        ) : (
                          <span className={`inline-block px-2 py-1 rounded text-xs font-bold border w-full sm:w-auto text-center sm:text-left ${getRoleColor(item.role, isNewBooth)}`}>
                            {item.role}
                          </span>
                        )}
                      </div>
                      
                      <div className="sm:w-2/3 p-2 sm:p-3 flex flex-col justify-center min-h-[3rem]">
                        {isEditMode ? (
                          <div className="w-full">
                            {changed && !isNewBooth && (
                              <div className="text-[10px] text-slate-400 mb-0.5 flex items-center gap-1">
                                基本: {defaultStaff} <span className="text-amber-500 font-bold">(変更あり)</span>
                              </div>
                            )}
                            {isNewBooth && (
                              <div className="text-[10px] text-fuchsia-600 mb-0.5 flex items-center gap-1 font-bold">
                                <IconSparkles className="w-3 h-3" /> 追加枠
                              </div>
                            )}
                            <input
                              type="text"
                              value={currentStaff}
                              onChange={(e) => handleInputChange(dataIndex, e.target.value)}
                              className={`w-full p-2 border-2 rounded-md outline-none transition-all font-medium text-sm ${
                                isError ? 'border-red-400 bg-red-50 text-red-900 focus:border-red-500' 
                                : isNewBooth ? 'border-fuchsia-300 bg-white focus:border-fuchsia-500'
                                : changed ? 'border-amber-300 bg-amber-50 focus:border-amber-500' 
                                : 'border-slate-300 bg-white focus:border-blue-500'
                              }`}
                              placeholder="担当者を入力"
                            />
                            
                            {hasLeaveConflict && (
                              <div className="text-red-600 text-[10px] font-bold mt-1 flex items-center gap-1">
                                <IconAlertTriangle className="w-3 h-3" /> 休暇者 ({conflictNames.join(', ')}) が含まれています
                              </div>
                            )}
                            {hasDoubleBooking && doubleBookings.map((db, i) => (
                              <div key={i} className="text-red-600 text-[10px] font-bold mt-1 flex items-center gap-1">
                                <IconAlertTriangle className="w-3 h-3" /> 重複: {db.name} (他: {db.others.join(', ')})
                              </div>
                            ))}
                            {egd2Error && (
                              <div className="text-rose-600 text-[10px] font-bold mt-1 flex items-center gap-1 bg-rose-100/50 p-1 rounded">
                                <IconAlertOctagon className="w-3.5 h-3.5" /> {egd2Error}
                              </div>
                            )}
                          </div>
                        ) : (
                          <div className="flex items-center justify-between w-full">
                            <div className="flex flex-col">
                              {changed ? (
                                <>
                                  {!isNewBooth && (
                                    <div className="flex items-center gap-1 text-slate-400 text-[10px] font-medium mb-0.5">
                                      <span className="line-through decoration-slate-400">{defaultStaff}</span>
                                      <IconArrowRight className="w-2.5 h-2.5" />
                                    </div>
                                  )}
                                  <span className={`text-base sm:text-lg font-black drop-shadow-sm ${
                                    isError ? 'text-red-700' : isNewBooth ? 'text-fuchsia-700' : 'text-red-600'
                                  }`}>
                                    {currentStaff || <span className="text-slate-300 text-sm font-normal">（未設定）</span>}
                                  </span>
                                </>
                              ) : (
                                <span className={`text-sm font-bold ${isError ? 'text-red-700' : 'text-slate-800'}`}>
                                  {currentStaff}
                                </span>
                              )}
                              
                              {hasLeaveConflict && (
                                <div className="text-red-600 text-[10px] font-bold mt-0.5 flex items-center gap-1">
                                  <IconAlertTriangle className="w-3 h-3" /> 休暇者 ({conflictNames.join(', ')}) が含まれています
                                </div>
                              )}
                              {hasDoubleBooking && doubleBookings.map((db, i) => (
                                <div key={i} className="text-red-600 text-[10px] font-bold mt-0.5 flex items-center gap-1">
                                  <IconAlertTriangle className="w-3 h-3" /> 重複: {db.name} (他: {db.others.join(', ')})
                                </div>
                              ))}
                              {egd2Error && (
                                <div className="text-rose-600 text-[10px] font-bold mt-0.5 flex items-center gap-1 bg-rose-100/50 p-1 rounded w-fit">
                                  <IconAlertOctagon className="w-3.5 h-3.5" /> {egd2Error}
                                </div>
                              )}
                            </div>
                            
                            <div className="flex gap-1 shrink-0 ml-2 flex-col sm:flex-row items-end">
                              {isNewBooth && !isError && (
                                <span className="inline-flex items-center gap-1 bg-fuchsia-100 text-fuchsia-700 text-[10px] px-1.5 py-0.5 rounded font-bold border border-fuchsia-300">
                                  <IconSparkles className="w-3 h-3" />
                                  <span className="hidden sm:inline">追加枠</span>
                                </span>
                              )}
                              {isError && (
                                <span className="inline-flex items-center gap-1 bg-red-600 text-white text-[10px] px-1.5 py-0.5 rounded font-bold shadow-sm">
                                  <IconAlertTriangle className="w-3 h-3" />
                                  <span className="hidden sm:inline">アラート</span>
                                </span>
                              )}
                              {changed && !isError && !isNewBooth && (
                                <span className="inline-flex items-center gap-1 bg-amber-100 text-amber-700 text-[10px] px-1.5 py-0.5 rounded font-bold border border-amber-300">
                                  <IconAlertCircle className="w-3 h-3" />
                                  <span className="hidden sm:inline">変更あり</span>
                                </span>
                              )}
                            </div>
                          </div>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
              
              {isEditMode && (
                <div className="bg-slate-50 p-3 border-t border-slate-200">
                  <button onClick={handleAddBooth} className="w-full py-2.5 bg-white border-2 border-dashed border-fuchsia-300 text-fuchsia-600 rounded-lg flex items-center justify-center gap-2 hover:bg-fuchsia-50 transition-colors font-bold text-sm">
                    <IconPlus className="w-4 h-4" /> 日ごとの追加枠（臨時枠）を作成する
                  </button>
                </div>
              )}
            </div>

            {isEditMode && (
              <div className="fixed bottom-0 left-0 right-0 bg-white border-t-2 border-blue-500 p-3 shadow-[0_-10px_20px_-5px_rgba(0,0,0,0.15)] z-40">
                <div className="max-w-4xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
                  <div className="text-sm font-bold text-blue-800 flex items-center gap-2 w-full sm:w-auto justify-center sm:justify-start">
                    <IconEdit className="w-5 h-5" />
                    <span>複数日の変更を保持中</span>
                    {changedDaysCount > 0 && (
                      <span className="bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full text-xs animate-pulse">
                        {changedDaysCount}日分
                      </span>
                    )}
                  </div>
                  <div className="flex gap-2 w-full sm:w-auto">
                    <button
                      onClick={handleCancel}
                      disabled={isSaving}
                      className="flex-1 sm:flex-none px-4 py-2.5 sm:py-2 rounded-md text-sm font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 transition-colors disabled:opacity-50 border border-slate-300 text-center"
                    >
                      キャンセル
                    </button>
                    <button
                      onClick={handleSave}
                      disabled={isSaving}
                      className="flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-6 py-2.5 sm:py-2 rounded-md text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 shadow-sm transition-colors disabled:opacity-50"
                    >
                      {isSaving ? <IconLoader2 className="w-4 h-4" /> : <IconSave className="w-4 h-4" />}
                      {isSaving ? '保存中...' : (changedDaysCount > 0 ? `${changedDaysCount}日分を一括保存` : '保存')}
                    </button>
                  </div>
                </div>
              </div>
            )}
          </main>

          {showLoginModal && (
            <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
              <div className="bg-white rounded-xl shadow-xl w-full max-w-sm overflow-hidden animate-in fade-in zoom-in-95 duration-200">
                <div className="flex justify-between items-center p-4 border-b border-slate-200 bg-slate-50">
                  <h3 className="font-bold text-sm flex items-center gap-1.5 text-slate-800">
                    <IconLock className="w-4 h-4 text-blue-600" />
                    管理者ログイン
                  </h3>
                  <button 
                    onClick={() => { setShowLoginModal(false); setLoginError(''); setPassword(''); }}
                    className="p-1 hover:bg-slate-200 rounded text-slate-500 transition-colors"
                  >
                    <IconX className="w-4 h-4" />
                  </button>
                </div>
                
                <form onSubmit={handleLogin} className="p-5">
                  <p className="text-xs text-slate-600 mb-4 leading-relaxed">
                    出番や枠を変更するにはパスワードを入力してください。
                  </p>
                  
                  <div className="mb-5">
                    <input
                      type="password"
                      placeholder="パスワード"
                      value={password}
                      onChange={(e) => setPassword(e.target.value)}
                      className="w-full p-2.5 border-2 border-slate-300 rounded-md outline-none focus:border-blue-500 transition-all text-sm font-medium"
                      autoFocus
                    />
                    {loginError && (
                      <p className="text-red-600 text-xs mt-1.5 flex items-center gap-1 font-bold">
                        <IconAlertCircle className="w-3.5 h-3.5" />
                        {loginError}
                      </p>
                    )}
                  </div>
                  
                  <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-md shadow-sm transition-colors text-sm">
                    ログイン
                  </button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
